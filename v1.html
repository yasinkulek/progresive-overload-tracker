<!DOCTYPE html>
<html lang="tr" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Progressive overload takibi: antrenman kayıtları, hacim, rekorlar ve aylık hedefler.">
  <title>Overload — Progressive Overload Tracker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       1. Tema değişkenleri
       ============================================================ */
    :root {
      --bg:            #0a0a0f;
      --bg-subtle:     #121218;
      --card:          #161620;
      --card-hover:    #1e1e2a;
      --fg:            #e8e8f0;
      --fg-dim:        #b6b6c4;
      --muted:         #737385;
      --accent:        #00d4aa;
      --accent-fg:     #04120e;
      --accent-soft:   rgba(0, 212, 170, 0.12);
      --warning:       #ff6b35;
      --danger:        #f4526a;
      --success:       #00d4aa;
      --border:        #2a2a3a;
      --border-strong: #3a3a50;
      --shadow:        0 18px 40px -20px rgba(0, 0, 0, 0.85);
      --radius:        12px;
      --radius-sm:     8px;
      --transition:    160ms cubic-bezier(.4, 0, .2, 1);
      --grid-line:     rgba(255, 255, 255, .045);
    }

    :root[data-theme="light"] {
      --bg:            #f6f7f9;
      --bg-subtle:     #eef0f4;
      --card:          #ffffff;
      --card-hover:    #f4f5f8;
      --fg:            #12131a;
      --fg-dim:        #454a58;
      --muted:         #6b7080;
      --accent:        #0a7f68;
      --accent-fg:     #ffffff;
      --accent-soft:   rgba(10, 127, 104, 0.10);
      --warning:       #c2410c;
      --danger:        #d1344c;
      --success:       #0a7f68;
      --border:        #e3e6ec;
      --border-strong: #cdd2dc;
      --shadow:        0 18px 40px -24px rgba(16, 24, 40, 0.35);
      --grid-line:     rgba(16, 24, 40, 0.045);
    }

    /* ============================================================
       2. Reset & temel
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--fg);
      -webkit-text-size-adjust: 100%;
      color-scheme: dark;
    }
    :root[data-theme="light"] { color-scheme: light; }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    body.no-scroll { overflow: hidden; }

    h1, h2, h3, .font-display { font-family: 'Space Grotesk', system-ui, sans-serif; }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .visually-hidden {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    /* ============================================================
       3. Arka plan katmanları
       ============================================================ */
    .bg-layer {
      position: fixed; inset: 0; z-index: -2; pointer-events: none;
      background:
        radial-gradient(ellipse 100% 60% at 50% -10%, rgba(0, 212, 170, .07) 0%, transparent 55%),
        radial-gradient(ellipse 80% 45% at 50% 108%, rgba(56, 120, 255, .05) 0%, transparent 55%),
        var(--bg);
    }
    :root[data-theme="light"] .bg-layer {
      background:
        radial-gradient(ellipse 100% 60% at 50% -10%, rgba(10, 127, 104, .07) 0%, transparent 55%),
        radial-gradient(ellipse 80% 45% at 50% 108%, rgba(56, 120, 255, .05) 0%, transparent 55%),
        var(--bg);
    }

    .grid-overlay {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 56px 56px;
    }

    /* ============================================================
       4. Yerleşim
       ============================================================ */
    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px 20px 64px;
    }

    @media (max-width: 640px) {
      .container { padding: 16px 14px 48px; }
    }

    /* ---- Header ---- */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding-bottom: 18px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .brand { display: flex; flex-direction: column; gap: 2px; }
    .brand h1 { font-size: 26px; font-weight: 700; letter-spacing: -.4px; line-height: 1.1; }
    .brand .subtitle {
      font-size: 10px; text-transform: uppercase;
      letter-spacing: 1.6px; color: var(--muted); font-weight: 500;
    }

    .header-actions { display: flex; align-items: center; gap: 10px; }

    .theme-toggle {
      display: flex; align-items: center; gap: 8px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 999px; padding: 5px 12px 5px 6px;
    }
    .theme-toggle-btn {
      width: 28px; height: 28px; flex: none;
      display: flex; align-items: center; justify-content: center;
      border: none; border-radius: 50%;
      background: transparent; color: var(--muted);
      cursor: pointer; transition: var(--transition);
    }
    .theme-toggle-btn:hover { background: var(--bg-subtle); color: var(--fg); }
    .theme-toggle-label { font-size: 11px; color: var(--muted); font-weight: 500; white-space: nowrap; }

    /* ---- Sekmeler ---- */
    .nav-tabs {
      display: flex; gap: 4px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 4px; margin-bottom: 18px;
    }
    .nav-tab {
      flex: 1; padding: 11px 16px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .6px;
      color: var(--muted); background: transparent;
      border: none; border-radius: var(--radius-sm); cursor: pointer;
      transition: var(--transition);
    }
    .nav-tab:hover { color: var(--fg); background: var(--bg-subtle); }
    .nav-tab[aria-selected="true"] { color: var(--accent); background: var(--accent-soft); }

    @media (max-width: 640px) { .nav-tab { padding: 10px 8px; font-size: 10px; letter-spacing: .3px; } }

    /* ============================================================
       5. Gün ızgarası (hafta seçici)
       ============================================================ */
    .week-bar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 10px;
    }
    .week-label { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; color: var(--fg-dim); }
    .week-nav { display: flex; gap: 6px; }
    .icon-btn {
      width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--muted); cursor: pointer; transition: var(--transition);
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .icon-btn:disabled { opacity: .35; cursor: not-allowed; }

    .days-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 20px;
    }

    .day-card {
      position: relative;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 8px 12px;
      text-align: center; cursor: pointer;
      font-family: inherit; color: inherit;
      transition: var(--transition);
    }
    .day-card:hover { border-color: var(--border-strong); background: var(--card-hover); transform: translateY(-2px); }
    .day-card[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
    .day-card.is-today .day-number { color: var(--accent); }
    .day-card.is-today::after {
      content: ''; position: absolute; inset-inline: 22%; bottom: 6px;
      height: 2px; border-radius: 2px; background: var(--accent);
    }

    .day-name { font-family: 'Space Grotesk', sans-serif; font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
    .day-number { font-size: 22px; font-weight: 700; line-height: 1.2; margin-top: 4px; }
    .day-meta { font-size: 9px; color: var(--muted); margin-top: 2px; min-height: 12px; }
    .day-meta.has-workout { color: var(--success); font-weight: 600; }

    @media (max-width: 640px) {
      .days-grid { gap: 4px; }
      .day-card { padding: 10px 4px 12px; border-radius: 10px; }
      .day-name { font-size: 8px; letter-spacing: .4px; }
      .day-number { font-size: 16px; }
      .day-meta { font-size: 8px; }
    }

    /* ============================================================
       6. Kart / panel
       ============================================================ */
    .panel {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 22px;
    }
    @media (max-width: 640px) { .panel { padding: 16px; } }

    .section-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap; margin-bottom: 16px;
    }
    .section-title { font-size: 17px; font-weight: 600; }
    .section-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* ============================================================
       7. Program seçici
       ============================================================ */
    .program-selector { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .program-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; background: var(--bg-subtle);
      border: 1px solid var(--border); border-radius: 999px;
      font-family: inherit; font-size: 11px; font-weight: 500; color: var(--fg-dim);
      cursor: pointer; transition: var(--transition);
    }
    .program-chip:hover { border-color: var(--border-strong); color: var(--fg); }
    .program-chip[aria-pressed="true"] {
      color: var(--fg); border-color: var(--chip-color, var(--accent));
      background: var(--chip-bg, var(--accent-soft));
    }
    .program-chip .chip-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--chip-color, var(--muted)); flex: none; }

    /* ============================================================
       8. Egzersiz kartı
       ============================================================ */
    .exercise-card {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      animation: rise .25s ease both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .exercise-head {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
      flex-wrap: wrap; margin-bottom: 12px;
    }
    .exercise-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .exercise-name { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600; }
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 999px;
      font-size: 9px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase;
      border: 1px solid transparent;
    }
    .badge-program { background: var(--badge-bg, var(--accent-soft)); color: var(--badge-fg, var(--accent)); border-color: var(--badge-bg, var(--accent-soft)); }
    .badge-pr { background: rgba(255, 176, 32, .14); color: #ffb020; border-color: rgba(255, 176, 32, .3); }
    :root[data-theme="light"] .badge-pr { background: rgba(214, 138, 0, .12); color: #b26a00; border-color: rgba(214, 138, 0, .28); }

    .exercise-stats { display: flex; gap: 14px; flex-wrap: wrap; }
    .ex-stat { text-align: right; }
    .ex-stat-value { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 700; color: var(--fg); }
    .ex-stat-label { font-size: 9px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }

    /* ---- Set listesi ---- */
    .sets-head, .set-row {
      display: grid;
      grid-template-columns: 42px 1fr 1fr 74px 34px;
      gap: 8px; align-items: center;
    }
    .sets-head {
      font-size: 9px; text-transform: uppercase; letter-spacing: .8px;
      color: var(--muted); padding: 0 2px 6px;
    }
    .set-row { margin-bottom: 6px; }
    .set-row:last-of-type { margin-bottom: 0; }

    .set-index {
      font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 600;
      color: var(--muted); text-align: center;
    }
    .set-row.is-pr .set-index { color: #ffb020; }

    .set-input {
      width: 100%; background: var(--card);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 8px 10px; font-family: inherit; font-size: 13px; color: var(--fg);
      transition: var(--transition);
    }
    .set-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .set-input::-webkit-outer-spin-button, .set-input::-webkit-inner-spin-button { opacity: .4; }
    .set-row.is-pr .set-input { border-color: rgba(255, 176, 32, .5); }

    .set-volume { font-size: 11px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
    .set-row.is-pr .set-volume { color: #ffb020; }

    .row-del {
      width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
      background: transparent; border: 1px solid transparent; border-radius: var(--radius-sm);
      color: var(--muted); cursor: pointer; transition: var(--transition);
    }
    .row-del:hover { color: var(--danger); background: rgba(244, 82, 106, .12); border-color: rgba(244, 82, 106, .3); }

    @media (max-width: 560px) {
      .sets-head { display: none; }
      .set-row {
        grid-template-columns: 30px 1fr 1fr 30px;
        grid-template-areas: 'idx w r del' 'vol vol vol vol';
        row-gap: 2px;
      }
      .set-row .set-index { grid-area: idx; }
      .set-row .set-input.weight { grid-area: w; }
      .set-row .set-input.reps { grid-area: r; }
      .set-row .set-volume { grid-area: vol; text-align: left; padding-left: 38px; }
      .set-row .row-del { grid-area: del; }
      .set-input::placeholder { font-size: 10px; }
    }

    /* ---- Set ekleme ---- */
    .add-set-btn {
      width: 100%; margin-top: 10px; padding: 9px;
      background: transparent; border: 1px dashed var(--border-strong);
      border-radius: var(--radius-sm); color: var(--muted);
      font-family: inherit; font-size: 11px; font-weight: 500; cursor: pointer;
      transition: var(--transition);
    }
    .add-set-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

    /* ---- İlerleme çubuğu ---- */
    .progress-track {
      width: 100%; height: 6px; background: var(--border);
      border-radius: 999px; overflow: hidden; margin-top: 12px;
    }
    .progress-fill {
      height: 100%; width: 0%; border-radius: 999px;
      background: linear-gradient(90deg, var(--success), var(--accent));
      transition: width .35s ease;
    }

    /* ============================================================
       9. Butonlar
       ============================================================ */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 9px 18px; border: 1px solid transparent; border-radius: var(--radius-sm);
      font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
      transition: var(--transition); white-space: nowrap;
    }
    .btn-primary { background: var(--accent); color: var(--accent-fg); }
    .btn-primary:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn-secondary { background: var(--card); color: var(--fg); border-color: var(--border); }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .btn-ghost { background: transparent; color: var(--muted); }
    .btn-ghost:hover { color: var(--fg); background: var(--bg-subtle); }
    .btn-danger { background: rgba(244, 82, 106, .12); color: var(--danger); border-color: rgba(244, 82, 106, .28); }
    .btn-danger:hover { background: rgba(244, 82, 106, .22); }
    .btn-sm { padding: 6px 11px; font-size: 11px; }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

    /* ============================================================
       10. Boş durum
       ============================================================ */
    .empty-state { text-align: center; padding: 44px 20px; color: var(--muted); }
    .empty-state svg { width: 42px; height: 42px; margin: 0 auto 12px; opacity: .45; }
    .empty-state h3 { font-size: 15px; margin-bottom: 4px; color: var(--fg-dim); }
    .empty-state p { font-size: 12px; max-width: 340px; margin: 0 auto 16px; }

    /* ============================================================
       11. İstatistik kartları
       ============================================================ */
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px; margin-bottom: 18px;
    }
    .stat-card {
      background: var(--bg-subtle); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 16px;
    }
    .stat-value { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; color: var(--fg); line-height: 1.15; font-variant-numeric: tabular-nums; }
    .stat-value .unit { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 3px; }
    .stat-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-top: 4px; }
    .stat-card.is-accent .stat-value { color: var(--accent); }

    /* ============================================================
       12. Hafta / Ay görünümleri
       ============================================================ */
    .week-summary { display: flex; flex-direction: column; gap: 10px; }
    .week-summary.is-prev { opacity: .82; }
    .week-summary.is-prev .summary-row:hover { opacity: 1; }
    .summary-row {
      display: grid; grid-template-columns: 92px 1fr 84px;
      gap: 12px; align-items: center;
      padding: 10px 12px; border-radius: var(--radius-sm);
      background: var(--bg-subtle); border: 1px solid transparent;
    }
    .summary-row.is-selected { border-color: var(--accent); background: var(--accent-soft); }
    .summary-day { font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 600; }
    .summary-day small { display: block; font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 400; color: var(--muted); }
    .bar-track { height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--success)); border-radius: 999px; transition: width .4s ease; }
    .summary-value { font-size: 12px; text-align: right; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
    .summary-value small { display: block; font-size: 9px; color: var(--muted); }

    @media (max-width: 560px) {
      .summary-row { grid-template-columns: 74px 1fr 62px; gap: 8px; padding: 9px 10px; }
      .summary-day { font-size: 11px; }
    }

    /* ---- Ay takvimi ---- */
    .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .cal-head {
      text-align: center; font-size: 9px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .8px; color: var(--muted); padding-bottom: 4px;
    }
    .cal-cell {
      position: relative; min-height: 66px; padding: 7px;
      background: var(--bg-subtle); border: 1px solid transparent;
      border-radius: var(--radius-sm); text-align: left;
      font-family: inherit; color: inherit; cursor: pointer;
      transition: var(--transition);
    }
    .cal-cell:hover { border-color: var(--border-strong); }
    .cal-cell.is-outside { opacity: .35; }
    .cal-cell.is-today .cal-num { color: var(--accent); font-weight: 700; }
    .cal-cell[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
    .cal-num { font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 500; }
    .cal-vol { font-size: 9px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
    .cal-cell.has-workout::before {
      content: ''; position: absolute; top: 8px; right: 8px;
      width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    }

    @media (max-width: 560px) {
      .cal-cell { min-height: 52px; padding: 5px; }
      .cal-vol { font-size: 8px; }
    }

    /* ---- Rekor listesi ---- */
    .pr-list { display: flex; flex-direction: column; gap: 8px; }
    .pr-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 11px 14px; background: var(--bg-subtle);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
    }
    .pr-name { font-size: 13px; font-weight: 500; }
    .pr-date { font-size: 10px; color: var(--muted); }
    .pr-weight { font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700; color: #ffb020; white-space: nowrap; }
    :root[data-theme="light"] .pr-weight { color: #b26a00; }

    /* ============================================================
       13. Modal
       ============================================================ */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 200;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, .72); backdrop-filter: blur(5px);
      opacity: 0; visibility: hidden; transition: var(--transition);
    }
    .modal-overlay.is-open { opacity: 1; visibility: visible; }
    .modal-content {
      width: 100%; max-width: 420px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px;
      box-shadow: var(--shadow);
      transform: scale(.94) translateY(10px); transition: var(--transition);
      max-height: 90vh; overflow-y: auto;
    }
    .modal-overlay.is-open .modal-content { transform: none; }
    .modal-title { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
    .modal-description { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
    .modal-input {
      width: 100%; padding: 11px 14px;
      background: var(--bg-subtle); border: 1px solid var(--border);
      border-radius: var(--radius-sm); font-family: inherit; font-size: 13px; color: var(--fg);
      transition: var(--transition);
    }
    .modal-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .modal-input::placeholder { color: var(--muted); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .modal-field { margin-bottom: 14px; }
    .modal-label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-bottom: 6px; }

    .suggestion-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .suggestion-chip {
      padding: 7px 11px; background: var(--bg-subtle);
      border: 1px solid var(--border); border-radius: 999px;
      font-family: inherit; font-size: 11px; color: var(--fg-dim);
      cursor: pointer; transition: var(--transition);
    }
    .suggestion-chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .suggestion-chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

    /* ============================================================
       14. Bildirim (toast)
       ============================================================ */
    .toast-stack {
      position: fixed; bottom: 18px; right: 18px; z-index: 300;
      display: flex; flex-direction: column; gap: 8px;
      max-width: min(340px, calc(100vw - 36px));
      pointer-events: none;
    }
    .toast { pointer-events: auto; }
    .toast {
      display: flex; align-items: flex-start; gap: 10px;
      background: var(--card); border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      padding: 11px 13px; border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
      font-size: 12px; color: var(--fg);
      animation: slide-in .22s ease both;
    }
    .toast.is-success { border-left-color: var(--success); }
    .toast.is-error   { border-left-color: var(--danger); }
    .toast.is-warning { border-left-color: var(--warning); }
    .toast.is-leaving { animation: slide-out .18s ease both; }
    .toast-msg { flex: 1; }
    .toast-close {
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 15px; line-height: 1; padding: 0 2px;
    }
    .toast-close:hover { color: var(--fg); }

    @keyframes slide-in { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
    @keyframes slide-out { to { opacity: 0; transform: translateX(16px); } }

    /* ============================================================
       15. Ay hedef kartı
       ============================================================ */
    .goal-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px; margin-top: 16px;
    }
    .goal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .goal-title { font-size: 13px; font-weight: 600; }
    .goal-sub { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .goal-values { display: flex; align-items: baseline; gap: 8px; font-family: 'Space Grotesk', sans-serif; }
    .goal-current { font-size: 24px; font-weight: 700; color: var(--accent); }
    .goal-target { font-size: 13px; color: var(--muted); }

    /* ============================================================
       16. Geçen hafta / progresif artış paneli
       ============================================================ */
    .compare-panel {
      margin-top: 18px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }
    .compare-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap; margin-bottom: 12px;
    }
    .compare-title {
      display: flex; align-items: center; gap: 8px;
      font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600;
    }
    .compare-title svg { width: 15px; height: 15px; color: var(--accent); flex: none; }
    .compare-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }

    .compare-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--card);
      margin-bottom: 7px;
    }
    .compare-row:last-of-type { margin-bottom: 0; }
    .compare-row.status-new    { border-left: 3px solid var(--accent); }
    .compare-row.status-behind { border-left: 3px solid var(--warning); }
    .compare-row.status-ahead  { border-left: 3px solid var(--success); }
    .compare-row.status-same   { border-left: 3px solid var(--border-strong); }
    .compare-row.status-extra  { border-left: 3px solid var(--muted); }

    .compare-info { flex: 1; min-width: 150px; }
    .compare-name { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
    .compare-detail { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .compare-detail b { color: var(--fg-dim); font-weight: 600; }
    .compare-target { color: var(--accent); font-weight: 600; }

    .status-tag {
      display: inline-flex; align-items: center;
      padding: 2px 8px; border-radius: 999px;
      font-size: 9px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase;
      margin-left: 6px;
    }
    .tag-new    { background: var(--accent-soft); color: var(--accent); }
    .tag-behind { background: rgba(255, 107, 53, .14); color: var(--warning); }
    .tag-ahead  { background: rgba(0, 212, 170, .14); color: var(--success); }
    .tag-same   { background: var(--bg-subtle); color: var(--muted); }
    .tag-extra  { background: var(--bg-subtle); color: var(--muted); }
    :root[data-theme="light"] .tag-behind { background: rgba(194, 65, 12, .12); color: var(--warning); }
    :root[data-theme="light"] .tag-ahead  { background: rgba(10, 127, 104, .12); color: var(--success); }

    .compare-actions { display: flex; gap: 6px; flex-wrap: wrap; }

    /* ---- Progresif artış kutusu ---- */
    .progression-box {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 12px 14px; margin-top: 12px;
    }
    .progression-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; flex-wrap: wrap; margin-bottom: 8px;
    }
    .progression-title { font-size: 12px; font-weight: 600; color: var(--fg-dim); }
    .progression-rule { font-size: 10px; color: var(--muted); }

    .progression-list { display: flex; flex-direction: column; gap: 6px; }
    .progression-item {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap;
      padding: 8px 10px; background: var(--bg-subtle);
      border-radius: var(--radius-sm);
    }
    .progression-name { font-size: 12px; font-weight: 500; }
    .progression-values {
      font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
      display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
    }
    .progression-arrow { color: var(--accent); font-weight: 700; }
    .progression-new {
      font-family: 'Space Grotesk', sans-serif; font-weight: 700;
      color: var(--accent); font-size: 12px;
    }
    .progression-gain {
      font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px;
      color: var(--accent); background: var(--accent-soft);
      padding: 2px 7px; border-radius: 999px;
    }

    /* ---- Hafta seçici (geçen haftayı görüntüle) ---- */
    .week-picker {
      display: flex; align-items: center; gap: 10px;
      flex-wrap: wrap; margin-bottom: 12px;
    }
    .week-picker-label { font-size: 11px; color: var(--muted); flex: none; }
    .week-picker-days { display: flex; gap: 6px; flex-wrap: wrap; }
    .week-day-btn {
      padding: 7px 12px; background: var(--card);
      border: 1px solid var(--border); border-radius: 999px;
      font-family: inherit; font-size: 11px; font-weight: 600;
      color: var(--muted); cursor: pointer; transition: var(--transition);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .week-day-btn:hover { border-color: var(--accent); color: var(--accent); }
    .week-day-btn[aria-pressed="true"] {
      border-color: var(--accent); color: var(--accent);
      background: var(--accent-soft); font-weight: 700;
    }
    .week-day-btn .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
    .week-day-btn .dot.empty { background: var(--border-strong); }

    @media (max-width: 560px) {
      .compare-row { flex-direction: column; align-items: stretch; }
      .compare-actions .btn { flex: 1; }
    }

    /* ============================================================
       17. Erişilebilirlik & hareket azaltma
       ============================================================ */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* Mobilde bildirimler tam genişlikte, altta */
    @media (max-width: 640px) {
      .toast-stack {
        bottom: 14px; right: 14px; left: 14px;
        max-width: none;
      }
    }

    @media print {
      .header-actions, .nav-tabs, .week-bar, .btn, .add-set-btn, .row-del { display: none !important; }
      body { background: #fff; color: #000; }
    }
  </style>
</head>

<body>
  <div class="bg-layer" aria-hidden="true"></div>
  <div class="grid-overlay" aria-hidden="true"></div>

  <div class="container">
    <header class="header">
      <div class="brand">
        <h1>Overload</h1>
        <p class="subtitle">Progressive Overload Tracker</p>
      </div>

      <div class="header-actions">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Temayı değiştir">
          <span class="theme-toggle-btn" id="themeBtn" aria-hidden="true">🌙</span>
          <span class="theme-toggle-label" id="themeText">Karanlık</span>
        </button>
      </div>
    </header>

    <div class="nav-tabs" role="tablist" aria-label="Görünüm">
      <button class="nav-tab" role="tab" data-view="gun"   id="tab-gun"   aria-controls="viewPanel" aria-selected="true">Gün</button>
      <button class="nav-tab" role="tab" data-view="hafta" id="tab-hafta" aria-controls="viewPanel" aria-selected="false">Hafta</button>
      <button class="nav-tab" role="tab" data-view="ay"    id="tab-ay"    aria-controls="viewPanel" aria-selected="false">Ay</button>
    </div>

    <div class="week-bar">
      <span class="week-label" id="weekLabel">—</span>
      <div class="week-nav">
        <button class="icon-btn" id="prevWeek" type="button" aria-label="Önceki hafta">‹</button>
        <button class="icon-btn" id="nextWeek" type="button" aria-label="Sonraki hafta">›</button>
      </div>
    </div>

    <div class="days-grid" id="daysGrid" role="group" aria-label="Hafta günleri"></div>

    <main class="panel" id="viewPanel" role="tabpanel" aria-labelledby="tab-gun" tabindex="-1"></main>

    <section class="goal-card" id="goalCard" aria-label="Aylık hedef"></section>
  </div>

  <div class="toast-stack" id="toastStack" role="status" aria-live="polite"></div>

  <script>
  (function () {
    'use strict';

    /* ============================================================
       1. Sabitler
       ============================================================ */
    const STORAGE_KEY = 'overload-data-v2';
    const SCHEMA_VERSION = 2;

    const DAY_NAMES = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
    const DAY_SHORT = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];
    /** Pazartesi ile başlayan hafta sırası */
    const WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0];

    const PROGRAMS = {
      push:  { name: 'Push',        emoji: '🏋️', color: '#ff6b35', exercises: ['Bench Press', 'Incline Press', 'Triceps Pushdown', 'Lateral Raise'] },
      pull:  { name: 'Pull',        emoji: '🎣', color: '#38bdf8', exercises: ['Lat Pulldown', 'Barbell Row', 'Face Pull', 'Biceps Curl'] },
      legs:  { name: 'Bacak',       emoji: '🦵', color: '#10b981', exercises: ['Squat', 'Leg Press', 'Romanian Deadlift', 'Lunges'] },
      upper: { name: 'Üst Vücut',   emoji: '💪', color: '#f472b6', exercises: ['Overhead Press', 'Pull-ups', 'Dips', 'Shrugs'] },
      lower: { name: 'Alt Vücut',   emoji: '🏋️', color: '#6366f1', exercises: ['Leg Curl', 'Calf Raise', 'Plank', 'Russian Twist'] },
      full:  { name: 'Tüm Vücut',   emoji: '🔥', color: '#f97316', exercises: ['Deadlift', 'Clean & Press', 'Thruster', 'Burpees'] },
      rest:  { name: 'Dinlenme',    emoji: '😴', color: '#6b7280', exercises: [] },
      custom:{ name: 'Özel',        emoji: '✏️', color: '#8b8b9e', exercises: [] }
    };

    /* ============================================================
       2. State
       ============================================================ */
    const state = {
      version: SCHEMA_VERSION,
      exercises: [],      // { id, name, program, date (YYYY-MM-DD), sets: [{ id, weight, reps }] }
      monthlyGoal: 5000,  // kg·tekrar
      theme: 'dark',
      view: 'gun',
      selectedDate: todayISO(),
      activeProgram: null,
      copySourceDate: null,   // kopyalanacak kaynak gün (geçen hafta seçici)
      /* Progresif artış kuralları */
      progression: {
        weightStep: 2.5,   // haftalık kilo artışı (üst vücut)
        weightStepLower: 5,// alt vücut için kilo artışı
        repStep: 1        // kilo artırılamıyorsa tekrar artışı
      }
    };

    /* ============================================================
       3. Yardımcılar
       ============================================================ */
    function uid(prefix) {
      return (prefix || 'id') + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
    }

    function pad(n) { return String(n).padStart(2, '0'); }

    function toISO(date) {
      return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate());
    }

    function todayISO() { return toISO(new Date()); }

    function parseISO(iso) {
      const parts = String(iso).split('-').map(Number);
      return new Date(parts[0], (parts[1] || 1) - 1, parts[2] || 1);
    }

    /** Pazartesi başlangıçlı haftanın ilk günü */
    function startOfWeek(date) {
      const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      const dow = (d.getDay() + 6) % 7; // Pzt=0 ... Paz=6
      d.setDate(d.getDate() - dow);
      return d;
    }

    function addDays(date, days) {
      const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      d.setDate(d.getDate() + days);
      return d;
    }

    function weekDates(start) {
      const out = [];
      for (let i = 0; i < 7; i++) out.push(addDays(start, i));
      return out;
    }

    /** Seçili tarihin bulunduğu haftanın başlangıcı ve bitişi (ISO) */
    function weekBounds(dateISO) {
      const start = startOfWeek(parseISO(dateISO));
      const dates = weekDates(start);
      return { start: toISO(dates[0]), end: toISO(dates[6]), dates: dates };
    }

    /** Seçili günün bir önceki haftadaki karşılığı (aynı gün) */
    function sameDayPreviousWeek(dateISO) {
      return toISO(addDays(parseISO(dateISO), -7));
    }

    function sameMonth(a, b) {
      return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth();
    }

    const MONTH_NAMES = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran',
                         'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];

    function formatDateLong(iso) {
      const d = parseISO(iso);
      return d.getDate() + ' ' + MONTH_NAMES[d.getMonth()] + ' ' + d.getFullYear();
    }

    function formatDateShort(iso) {
      const d = parseISO(iso);
      return pad(d.getDate()) + '.' + pad(d.getMonth() + 1);
    }

    function num(v) {
      const n = typeof v === 'number' ? v : parseFloat(v);
      return Number.isFinite(n) ? n : 0;
    }

    /** HTML kaçışı — kullanıcı girdisi innerHTML'e girmeden önce */
    function esc(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&#38;')
        .replace(/</g, '&#60;')
        .replace(/>/g, '&#62;')
        .replace(/"/g, '&#34;')
        .replace(/'/g, '&#39;');
    }

    function hexToRgba(hex, alpha) {
      const h = hex.replace('#', '');
      const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
      const r = parseInt(full.slice(0, 2), 16) || 0;
      const g = parseInt(full.slice(2, 4), 16) || 0;
      const b = parseInt(full.slice(4, 6), 16) || 0;
      return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
    }

    function formatKg(n) {
      const v = num(n);
      return (Math.round(v * 10) / 10).toLocaleString('tr-TR');
    }

    /* ============================================================
       4. Kalıcı depolama
       ============================================================ */
    function loadState() {
      let raw = null;
      try {
        raw = localStorage.getItem(STORAGE_KEY);
      } catch (e) {
        console.warn('Veri okunamadı (localStorage kapalı olabilir):', e);
        return;
      }
      if (!raw) return;

      let data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        console.warn('Bozuk kayıt bulundu, varsayılanlara dönülüyor:', e);
        try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
        return;
      }
      if (!data || typeof data !== 'object') return;

      if (Array.isArray(data.exercises)) {
        state.exercises = data.exercises
          .filter(e => e && typeof e.name === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(e.date))
          .map(normalizeExercise);
      }
      if (Number.isFinite(data.monthlyGoal) && data.monthlyGoal > 0) state.monthlyGoal = data.monthlyGoal;
      if (data.progression && typeof data.progression === 'object') {
        const p = data.progression;
        if (Number.isFinite(p.weightStep) && p.weightStep >= 0) state.progression.weightStep = p.weightStep;
        if (Number.isFinite(p.weightStepLower) && p.weightStepLower >= 0) state.progression.weightStepLower = p.weightStepLower;
        if (Number.isFinite(p.repStep) && p.repStep >= 0) state.progression.repStep = p.repStep;
      }
      if (data.theme === 'light' || data.theme === 'dark') state.theme = data.theme;
      if (typeof data.selectedDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(data.selectedDate)) {
        state.selectedDate = data.selectedDate;
      }
      if (data.view === 'gun' || data.view === 'hafta' || data.view === 'ay') state.view = data.view;
    }

    function normalizeExercise(e) {
      const sets = Array.isArray(e.sets) ? e.sets.map(s => ({
        id: s && s.id ? s.id : uid('set'),
        weight: num(s && s.weight),
        reps: num(s && s.reps)
      })) : [];
      return {
        id: e.id || uid('ex'),
        name: String(e.name),
        program: (e.program && PROGRAMS[e.program]) ? e.program : 'custom',
        date: e.date,
        sets: sets
      };
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          version: SCHEMA_VERSION,
          exercises: state.exercises,
          monthlyGoal: state.monthlyGoal,
          progression: state.progression,
          theme: state.theme,
          selectedDate: state.selectedDate,
          view: state.view
        }));
      } catch (e) {
        console.warn('Kayıt yapılamadı:', e);
        toast('Veriler kaydedilemedi (tarayıcı depolaması dolu olabilir).', 'error');
      }
    }

    /* ============================================================
       5. Hesaplamalar
       ============================================================ */
    function exercisesOn(dateISO) {
      return state.exercises.filter(e => e.date === dateISO);
    }

    function setVolume(set) {
      return num(set.weight) * num(set.reps);
    }

    function exerciseVolume(ex) {
      return ex.sets.reduce((sum, s) => sum + setVolume(s), 0);
    }

    function exerciseBest(ex) {
      return ex.sets.reduce((max, s) => Math.max(max, num(s.weight)), 0);
    }

    function volumeOn(dateISO) {
      return exercisesOn(dateISO).reduce((sum, ex) => sum + exerciseVolume(ex), 0);
    }

    function setsOn(dateISO) {
      return exercisesOn(dateISO).reduce((sum, ex) => sum + ex.sets.length, 0);
    }

    function volumeInRange(fromISO, toISO) {
      return state.exercises.reduce((sum, ex) => {
        if (ex.date >= fromISO && ex.date <= toISO) return sum + exerciseVolume(ex);
        return sum;
      }, 0);
    }

    function workoutsInRange(fromISO, toISO) {
      const dates = new Set();
      state.exercises.forEach(ex => {
        if (ex.date >= fromISO && ex.date <= toISO) dates.add(ex.date);
      });
      return dates.size;
    }

    function monthRange(date) {
      const from = new Date(date.getFullYear(), date.getMonth(), 1);
      const to = new Date(date.getFullYear(), date.getMonth() + 1, 0);
      return { from: toISO(from), to: toISO(to) };
    }

    /* ============================================================
       Progresif artış hesaplama
       ============================================================ */

    /** Alt vücut hareketleri mi? (bunlarda daha hızlı kilo artışı uygulanır) */
    const LOWER_BODY_HINTS = ['squat', 'leg', 'deadlift', 'lunge', 'hip', 'thrust', 'calf', 'kaldirma', 'bacak', 'squat'];

    function isLowerBody(name) {
      const n = String(name).toLowerCase();
      return LOWER_BODY_HINTS.some(function (h) { return n.indexOf(h) !== -1; });
    }

    /**
     * Bir hareket için hedef setleri hesaplar.
     * Kural: geçen haftanın son setinin kilosuna göre ağırlık artır,
     *          artırılamıyorsa (çok yüksek ağırlık) tekrar artır.
     * Returns: { sets: [{weight, reps, prevWeight, prevReps, gain}], mode: 'weight'|'reps'|'none' }
     */
    function progressionTargets(prevExercise) {
      if (!prevExercise || !prevExercise.sets.length) {
        return { sets: [], mode: 'none' };
      }

      const step = isLowerBody(prevExercise.name) ? state.progression.weightStepLower : state.progression.weightStep;
      const repStep = state.progression.repStep;
      const prevSets = prevExercise.sets;

      /* Ağırlık artırılabilir mi? Son setin ağırlığına göre bak */
      const lastSet = prevSets[prevSets.length - 1];
      const lastWeight = num(lastSet.weight);
      const lastReps = num(lastSet.reps);

      /* Tüm setlerdeki en yüksek ağırlık */
      const topWeight = prevSets.reduce(function (m, s) { return Math.max(m, num(s.weight)); }, 0);

      /* Kilo artıramıyorsak tekrar artıracağız */
      const canAddWeight = topWeight > 0;
      const mode = canAddWeight ? 'weight' : 'reps';

      const sets = prevSets.map(function (s) {
        const pw = num(s.weight);
        const pr = num(s.reps);
        let tw = pw;
        let tr = pr;

        if (canAddWeight) {
          tw = pw + step;
        } else {
          tr = pr + repStep;
        }
        return {
          weight: tw,
          reps: tr,
          prevWeight: pw,
          prevReps: pr,
          gain: canAddWeight
            ? { type: 'weight', amount: step }
            : { type: 'reps', amount: repStep }
        };
      });

      /* Son sette tekrar artışı da öner (ağırlık + tekrar birlikte) */
      if (canAddWeight && mode === 'weight' && lastReps > 0 && lastReps < 12) {
        /* Kilo artarken son setin tekrarı da 1 artırılabilir */
        sets[sets.length - 1].reps = lastReps + repStep;
        sets[sets.length - 1].gain = { type: 'both', weight: step, reps: repStep };
      }

      return { sets: sets, mode: mode };
    }

    /**
     * İki günün hareketlerini karşılaştırır.
     * Returns: { name, status, prev, current, targets }
     * status: 'new' | 'same' | 'behind' | 'ahead' | 'done'
     */
    function compareDay(prevDateISO, currDateISO) {
      const prev = exercisesOn(prevDateISO);
      const curr = exercisesOn(currDateISO);
      const rows = [];

      prev.forEach(function (p) {
        const key = p.name.toLowerCase();
        const c = curr.find(function (x) { return x.name.toLowerCase() === key; }) || null;
        const targets = progressionTargets(p);

        let status;
        if (!c) {
          status = 'new';
        } else {
          const currBest = exerciseBest(c);
          const prevBest = exerciseBest(p);
          const currVol = exerciseVolume(c);
          const prevVol = exerciseVolume(p);
          if (currVol <= 0) status = 'new';
          else if (currBest > prevBest) status = 'ahead';
          else if (currBest < prevBest) status = 'behind';
          else if (currVol >= prevVol) status = 'same';
          else status = 'behind';
        }

        rows.push({ name: p.name, program: p.program, prev: p, current: c, targets: targets, status: status });
      });

      /* Yeni günde olup geçen haftada olmayan hareketler */
      curr.forEach(function (c) {
        const key = c.name.toLowerCase();
        const exists = prev.some(function (x) { return x.name.toLowerCase() === key; });
        if (!exists) {
          rows.push({ name: c.name, program: c.program, prev: null, current: c, targets: { sets: [], mode: 'none' }, status: 'extra' });
        }
      });

      return rows;
    }

    /** Hareket adına göre tüm zamanlar rekor ağırlık (PR) */
    function personalRecords() {
      const map = new Map();
      state.exercises.forEach(ex => {
        const key = ex.name.toLowerCase();
        const best = exerciseBest(ex);
        if (best <= 0) return;
        const current = map.get(key);
        if (!current || best > current.weight) {
          map.set(key, { name: ex.name, weight: best, date: ex.date });
        }
      });
      return Array.from(map.values()).sort((a, b) => b.weight - a.weight);
    }

    /**
     * Her hareket adı için güncel PR tutan seti belirler.
     * Eşitlik durumunda en eski kayıt (tarih → egzersiz → set sırası) kazanır,
     * böylece iki set aynı ağırlıktaysa rekor rozeti tek yerde kalır.
     */
    function currentPRSetIds() {
      const groups = new Map();
      state.exercises.forEach(function (ex, exIdx) {
        ex.sets.forEach(function (s, setIdx) {
          const w = num(s.weight);
          if (w <= 0) return;
          const key = ex.name.toLowerCase();
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push({ id: s.id, weight: w, date: ex.date, exIdx: exIdx, setIdx: setIdx });
        });
      });

      const ids = new Set();
      groups.forEach(function (list) {
        let best = list[0];
        list.forEach(function (c) {
          const newer = c.weight > best.weight ||
            (c.weight === best.weight && (
              c.date < best.date ||
              (c.date === best.date && (
                c.exIdx < best.exIdx ||
                (c.exIdx === best.exIdx && c.setIdx < best.setIdx)
              ))
            ));
          if (newer) best = c;
        });
        ids.add(best.id);
      });
      return ids;
    }

    /** Tüm setlerin PR bayraklarını güncel duruma göre senkronlar */
    function applyPRFlags() {
      const ids = currentPRSetIds();
      state.exercises.forEach(function (ex) {
        ex.sets.forEach(function (s) {
          s.isPR = ids.has(s.id);
        });
      });
    }

    /* ============================================================
       7. Bildirimler (toast)
       ============================================================ */
    function toast(message, type) {
      const stack = document.getElementById('toastStack');
      const el = document.createElement('div');
      el.className = 'toast is-' + (type || 'info');
      el.innerHTML = '<span class="toast-msg">' + esc(message) + '</span>' +
                     '<button class="toast-close" type="button" aria-label="Kapat">&times;</button>';
      stack.appendChild(el);

      /* Yeni bildirim en üste gelsin */
      stack.insertBefore(el, stack.firstChild);

      const close = function () {
        if (el.classList.contains('is-leaving')) return;
        el.classList.add('is-leaving');
        setTimeout(() => el.remove(), 200);
      };
      el.querySelector('.toast-close').addEventListener('click', close);
      setTimeout(close, 4200);
    }

    /* ============================================================
       8. Modal altyapısı (odak tuzağı + Esc + overlay)
       ============================================================ */
    const modalStack = [];
    let lastFocused = null;

    function openModal(buildContent, onMount) {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = '<div class="modal-content" role="dialog" aria-modal="true"></div>';
      const content = overlay.querySelector('.modal-content');
      content.appendChild(buildContent());

      document.body.appendChild(overlay);
      document.body.classList.add('no-scroll');
      lastFocused = document.activeElement;

      requestAnimationFrame(() => overlay.classList.add('is-open'));

      const onKeydown = function (e) {
        if (e.key === 'Escape') { e.preventDefault(); closeModal(overlay); return; }
        if (e.key === 'Tab') {
          const focusables = content.querySelectorAll(
            'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
          );
          if (!focusables.length) return;
          const first = focusables[0];
          const last = focusables[focusables.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      };
      overlay.addEventListener('keydown', onKeydown);
      overlay.addEventListener('mousedown', function (e) {
        if (e.target === overlay) closeModal(overlay);
      });

      modalStack.push(overlay);
      if (onMount) onMount(content);
      return overlay;
    }

    function closeModal(overlay) {
      const idx = modalStack.indexOf(overlay);
      if (idx === -1) return;
      modalStack.splice(idx, 1);
      overlay.classList.remove('is-open');
      setTimeout(() => overlay.remove(), 200);
      if (!modalStack.length) document.body.classList.remove('no-scroll');
      if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
    }

        const isToday = iso === today;
        const hasWorkout = exercisesOn(iso).length > 0;

               'data-date="' + iso + '" aria-pressed="' + (selected ? 'true' : 'false') + '" ' +
               'aria-label="' + esc(DAY_NAMES[dow] + ' ' + d.getDate() + ' ' + MONTH_NAMES[d.getMonth()]) +
               (hasWorkout ? ', antrenman var' : ', antrenman yok') + '">' +
