      { name: 'Sütlü Kahve (şekerli)', kcal: 55, p: 2.8, c: 8.0, f: 1.8, portion: '1 fincan', portionG: 200 },
      { name: 'Kola', kcal: 42, p: 0, c: 10.6, f: 0, portion: '1 kutu', portionG: 330 },
      { name: 'Maden Suyu', kcal: 25, p: 0, c: 6.2, f: 0, portion: '1 bardak', portionG: 200 },
      { name: 'Limonata', kcal: 42, p: 0.2, c: 10.5, f: 0, portion: '1 bardak', portionG: 200 },
      { name: 'Greyfurt Suyu', kcal: 42, p: 0.5, c: 10.0, f: 0.1, portion: '1 bardak', portionG: 200 }
    ];

    const MEALS = ['Kahvaltı', 'Öğle', 'Akşam', 'Atıştırmalık'];

    /** Kalori sekmesindeki arama metni (panel yeniden çizilse de korunur) */
    let foodQuery = '';

    /* ============================================================
       Open Food Facts — ücretsiz ürün arama API'si
       Adres: https://world.openfoodfacts.org/cgi/search.pl
       Yanıt: { count, page, page_count, page_size, products: [...], skip }
       Ürün:  { product_name, brands, code, nutriments: {...} }
       nutriments içinde 100 g başına değerler: 'energy-kcal_100g',
               'proteins_100g', 'carbohydrates_100g', 'fat_100g'
       (Bazı ürünlerde _100g anahtarları yok → o ürün atlanır.)
       ============================================================ */
    const OFF_API_HOSTS = [
      'https://world.openfoodfacts.org',
      'https://world.openfoodfacts.net',
      'https://fr.openfoodfacts.org',
      'https://uk.openfoodfacts.org'
    ];
    const OFF_PAGE_SIZE = 20;
    const OFF_TIMEOUT_MS = 12000;

    /* Kalori sekmesindeki internet aramasının son durumu */
    let offState = {
      status: 'idle',   /* 'idle' | 'loading' | 'ok' | 'error' */
      query: '',
      results: [],
      message: ''
    };

    function normalizeFoodLog(f) {
      return {
        id: f.id || uid('food'),
        date: f.date,
        meal: MEALS.indexOf(f.meal) !== -1 ? f.meal : 'Atıştırmalık',
        name: String(f.name),
        grams: num(f.grams),
        kcal: num(f.kcal),
        protein: num(f.protein),
        carbs: num(f.carbs),
        fat: num(f.fat)
      };
    }

    function normalizeCustomFood(f) {
      return {
        id: f.id || uid('cfood'),
        name: String(f.name),
        kcal: num(f.kcal),
        protein: num(f.protein),
        carbs: num(f.carbs),
        fat: num(f.fat)
      };
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          version: SCHEMA_VERSION,
          exercises: state.exercises,
          monthlyGoal: state.monthlyGoal,
          progression: state.progression,
          foodLog: state.foodLog,
          customFoods: state.customFoods,
          calorieGoal: state.calorieGoal,
          theme: state.theme,
          selectedDate: state.selectedDate,
          view: state.view
        }));
      } catch (e) {
        console.warn('Kayıt yapılamadı:', e);
        toast('Veriler kaydedilemedi (tarayıcı depolaması dolu olabilir).', 'error');
      }
    }

    /* ============================================================
       5. Hesaplamalar
       ============================================================ */
    function exercisesOn(dateISO) {
      return state.exercises.filter(e => e.date === dateISO);
    }

    function setVolume(set) {
      return num(set.weight) * num(set.reps);
    }

    function exerciseVolume(ex) {
      return ex.sets.reduce((sum, s) => sum + setVolume(s), 0);
    }

    function exerciseBest(ex) {
      return ex.sets.reduce((max, s) => Math.max(max, num(s.weight)), 0);
    }

    function volumeOn(dateISO) {
      return exercisesOn(dateISO).reduce((sum, ex) => sum + exerciseVolume(ex), 0);
    }

    function setsOn(dateISO) {
      return exercisesOn(dateISO).reduce((sum, ex) => sum + ex.sets.length, 0);
    }

    function volumeInRange(fromISO, toISO) {
      return state.exercises.reduce((sum, ex) => {
        if (ex.date >= fromISO && ex.date <= toISO) return sum + exerciseVolume(ex);
        return sum;
      }, 0);
    }

    function workoutsInRange(fromISO, toISO) {
      const dates = new Set();
      state.exercises.forEach(ex => {
        if (ex.date >= fromISO && ex.date <= toISO) dates.add(ex.date);
      });
      return dates.size;
    }

    function monthRange(date) {
      const from = new Date(date.getFullYear(), date.getMonth(), 1);
      const to = new Date(date.getFullYear(), date.getMonth() + 1, 0);
      return { from: toISO(from), to: toISO(to) };
    }

    /* ============================================================
       Yemek takibi hesaplamaları
       ============================================================ */
    function foodLogOn(dateISO) {
      return state.foodLog.filter(f => f.date === dateISO);
    }

    /** Günün toplam Besin değerleri */
    function foodTotals(dateISO) {
      return foodLogOn(dateISO).reduce(function (acc, f) {
        acc.kcal += num(f.kcal);
        acc.protein += num(f.protein);
        acc.carbs += num(f.carbs);
        acc.fat += num(f.fat);
        return acc;
      }, { kcal: 0, protein: 0, carbs: 0, fat: 0 });
    }

    /** Öğüne göre gruplandırılmış günlük kayıtlar */
    function foodByMeal(dateISO) {
      return MEALS.map(function (meal) {
        const items = foodLogOn(dateISO).filter(function (f) { return f.meal === meal; });
        const kcal = items.reduce(function (s, f) { return s + num(f.kcal); }, 0);
        return { meal: meal, items: items, kcal: kcal };
      });
    }

    /**
     * Türkçe karakterleri normalize eder — arama ı/i, ş/s, ğ/g, ç/c, ö/o, ü/u
     * farklarını yok sayar, büyük/küçük harf de önemli olmaz.
     * 'ş' → 's', 'ğ' → 'g', 'ü' → 'u', 'ö' → 'o', 'ç' → 'c', 'ı' → 'i'
     */
    function normalizeTr(str) {
      return String(str == null ? '' : str)
        .replace(/İ/g, 'i')       /* büyük noktalı I → i */
        .toLowerCase()            /* kalan büyük harfler küçüğe */
        .replace(/ı/g, 'i').replace(/ğ/g, 'g').replace(/ü/g, 'u')
        .replace(/ö/g, 'o').replace(/ç/g, 'c').replace(/ş/g, 's')
        .replace(/â/g, 'a').replace(/î/g, 'i').replace(/û/g, 'u')
        .trim();
    }

    /** Yerleşik bir yemeği arama sonucu biçimine çevirir */
    function toFoodResult(f, i) {
      return {
        id: 'food-' + i,
        name: f.name,
        kcal: f.kcal, p: f.p, c: f.c, f: f.f,
        portion: f.portion || '',
        portionG: f.portionG || 0,
        custom: false
      };
    }

    /** Özel bir yemeği arama sonucu biçimine çevirir */
    function toCustomFoodResult(cf) {
      return {
        id: 'cfood-' + cf.id,
        name: cf.name,
        kcal: cf.kcal, p: cf.protein, c: cf.carbs, f: cf.fat,
        portion: '100 g',
        portionG: 100,
        custom: true
      };
    }

    /**
     * Yerleşik listede + kullanıcının özel yemeklerinde arama.
     * Türkçe karakter ve büyük/küçük harf farkı yok sayılır.
     * @param query arama metni
     * @param limit en fazla kaç sonuç
     * @returns eşleşen yemekler (id, name, kcal, p, c, f, portion, portionG, custom)
     */
    function searchFoods(query, limit) {
      const q = normalizeTr(query);
      if (!q) return [];
      const max = limit || 40;
      const words = q.split(/\s+/).filter(Boolean);
      const customResults = [];
      const builtinResults = [];

      const matches = function (name) {
        const haystack = normalizeTr(name);
        for (let w = 0; w < words.length; w++) {
          if (haystack.indexOf(words[w]) === -1) return false;
        }
        return true;
      };

      /* Kullanıcının özel yemekleri — az sayıda oldukları için önce gelir,
         böylece yerleşik liste sonuçları onları sıfırlamaz */
      for (let i = 0; i < state.customFoods.length; i++) {
        const cf = state.customFoods[i];
        if (matches(cf.name)) customResults.push(toCustomFoodResult(cf));
      }

      /* Yerleşik liste */
      for (let i = 0; i < FOODS.length; i++) {
        const f = FOODS[i];
        if (matches(f.name)) builtinResults.push(toFoodResult(f, i));
      }

      return customResults.concat(builtinResults).slice(0, max);
    }

    /* ============================================================
       Open Food Facts — internetten ürün arama
       ============================================================ */

    /**
     * OFF ürününü uygulamadaki yemek biçimine çevirir.
     * Yalnızca 100 g başına değerleri olan ürünler kabul edilir.
     * @returns {object|null} geçerli değerler yoksa null
     */
    function toOffFoodResult(p, idx) {
      if (!p || typeof p !== 'object') return null;
      const n = p.nutriments;
      if (!n || typeof n !== 'object') return null;

      /* 100 g başına değerler — anahtar yoksa ürün kullanılamaz */
      const kcal = n['energy-kcal_100g'];
      const protein = n['proteins_100g'];
      const carbs = n['carbohydrates_100g'];
      const fat = n['fat_100g'];

      const name = String(p.product_name || '').trim();
      if (!name) return null;
      if (!Number.isFinite(kcal) || kcal < 0) return null;

      /* Makrolar eksikse 0 kabul edilir, ama enerji şart */
      const P = Number.isFinite(protein) && protein >= 0 ? protein : 0;
      const C = Number.isFinite(carbs) && carbs >= 0 ? carbs : 0;
      const F = Number.isFinite(fat) && fat >= 0 ? fat : 0;

      const brand = String(p.brands || '').trim();

      return {
        id: 'off-' + idx,
        name: name,
        brand: brand,
        code: p.code ? String(p.code) : '',
        kcal: kcal,
        p: P,
        c: C,
        f: F,
        portion: '100 g',
        portionG: 100,
        custom: false,
        off: true
      };
    }

    /**
     * Open Food Facts'ta arama yapar. Host'lar sırayla denenir; biri
     * çalışmazsa diğerine geçilir. Hata durumunda false döner.
     * @returns {Promise<{ok: boolean, results: Array, message: string}>}
     */
    function fetchOffFoods(query) {
      const q = String(query || '').trim();
      const empty = { ok: false, results: [], message: 'Arama yapılamadı.' };

      if (!q) {
        return Promise.resolve({ ok: true, results: [], message: '' });
      }

      const url = OFF_API_HOSTS.map(function (host, i) {
        return host + '/cgi/search.pl' +
          '?search_terms=' + encodeURIComponent(q) +
          '&search_simple=1&action=process&json=1' +
          '&page_size=' + OFF_PAGE_SIZE +
          '&fields=' + encodeURIComponent('product_name,brands,code,nutriments');
      });

      /* Host'ları sırayla dene — ilk çalışan yanıtı kullan */
      function tryHost(index) {
        if (index >= url.length) {
          return Promise.resolve({
            ok: false,
            results: [],
            message: 'Open Food Facts’a ulaşılamadı. İnternet bağlantını kontrol edip tekrar dene.'
          });
        }

        const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
        const timer = controller
          ? setTimeout(function () { controller.abort(); }, OFF_TIMEOUT_MS)
          : null;

        const options = { method: 'GET', headers: { Accept: 'application/json' } };
        if (controller) options.signal = controller.signal;

        return fetch(url[index], options)
          .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          })
          .then(function (data) {
            if (timer) clearTimeout(timer);
            if (!data || !Array.isArray(data.products)) throw new Error('Beklenmeyen yanıt');

            const results = [];
            for (let i = 0; i < data.products.length; i++) {
              const converted = toOffFoodResult(data.products[i], i);
              if (converted) results.push(converted);
            }
            return { ok: true, results: results, message: '' };
          })
          .catch(function (err) {
            if (timer) clearTimeout(timer);
            /* Bu host çalışmadı — sıradakini dene */
            return tryHost(index + 1);
          });
      }

      return tryHost(0);
    }

    /* ============================================================
       Progresif artış hesaplama
       ============================================================ */

    /** Alt vücut hareketleri mi? (bunlarda daha hızlı kilo artışı uygulanır) */
    const LOWER_BODY_HINTS = ['squat', 'leg', 'deadlift', 'lunge', 'hip', 'thrust', 'calf', 'kaldirma', 'bacak', 'squat'];

    function isLowerBody(name) {
      const n = String(name).toLowerCase();
      return LOWER_BODY_HINTS.some(function (h) { return n.indexOf(h) !== -1; });
    }

    /**
     * Bir hareket için hedef setleri hesaplar.
     * Kural: geçen haftanın son setinin kilosuna göre ağırlık artır,
     *          artırılamıyorsa (çok yüksek ağırlık) tekrar artır.
     * Returns: { sets: [{weight, reps, prevWeight, prevReps, gain}], mode: 'weight'|'reps'|'none' }
     */
    function progressionTargets(prevExercise) {
      if (!prevExercise || !prevExercise.sets.length) {
        return { sets: [], mode: 'none' };
      }

      const step = isLowerBody(prevExercise.name) ? state.progression.weightStepLower : state.progression.weightStep;
      const repStep = state.progression.repStep;
      const prevSets = prevExercise.sets;

      /* Ağırlık artırılabilir mi? Son setin ağırlığına göre bak */
      const lastSet = prevSets[prevSets.length - 1];
      const lastWeight = num(lastSet.weight);
      const lastReps = num(lastSet.reps);

      /* Tüm setlerdeki en yüksek ağırlık */
      const topWeight = prevSets.reduce(function (m, s) { return Math.max(m, num(s.weight)); }, 0);

      /* Kilo artıramıyorsak tekrar artıracağız */
      const canAddWeight = topWeight > 0;
      const mode = canAddWeight ? 'weight' : 'reps';

      const sets = prevSets.map(function (s) {
        const pw = num(s.weight);
        const pr = num(s.reps);
        let tw = pw;
        let tr = pr;

        if (canAddWeight) {
          tw = pw + step;
        } else {
          tr = pr + repStep;
        }
        return {
          weight: tw,
          reps: tr,
          prevWeight: pw,
          prevReps: pr,
          gain: canAddWeight
            ? { type: 'weight', amount: step }
            : { type: 'reps', amount: repStep }
        };
      });

      /* Son sette tekrar artışı da öner (ağırlık + tekrar birlikte) */
      if (canAddWeight && mode === 'weight' && lastReps > 0 && lastReps < 12) {
        /* Kilo artarken son setin tekrarı da 1 artırılabilir */
        sets[sets.length - 1].reps = lastReps + repStep;
        sets[sets.length - 1].gain = { type: 'both', weight: step, reps: repStep };
      }

      return { sets: sets, mode: mode };
    }

    /**
     * İki günün hareketlerini karşılaştırır.
     * Returns: { name, status, prev, current, targets }
     * status: 'new' | 'same' | 'behind' | 'ahead' | 'done'
     */
    function compareDay(prevDateISO, currDateISO) {
      const prev = exercisesOn(prevDateISO);
      const curr = exercisesOn(currDateISO);
      const rows = [];

      prev.forEach(function (p) {
        const key = p.name.toLowerCase();
        const c = curr.find(function (x) { return x.name.toLowerCase() === key; }) || null;
        const targets = progressionTargets(p);

        let status;
        if (!c) {
          status = 'new';
        } else {
          const currBest = exerciseBest(c);
          const prevBest = exerciseBest(p);
          const currVol = exerciseVolume(c);
          const prevVol = exerciseVolume(p);
          if (currVol <= 0) status = 'new';
          else if (currBest > prevBest) status = 'ahead';
          else if (currBest < prevBest) status = 'behind';
          else if (currVol >= prevVol) status = 'same';
          else status = 'behind';
        }

        rows.push({ name: p.name, program: p.program, prev: p, current: c, targets: targets, status: status });
      });

      /* Yeni günde olup geçen haftada olmayan hareketler */
      curr.forEach(function (c) {
        const key = c.name.toLowerCase();
        const exists = prev.some(function (x) { return x.name.toLowerCase() === key; });
        if (!exists) {
          rows.push({ name: c.name, program: c.program, prev: null, current: c, targets: { sets: [], mode: 'none' }, status: 'extra' });
        }
      });

      return rows;
    }

    /** Hareket adına göre tüm zamanlar rekor ağırlık (PR) */
    function personalRecords() {
      const map = new Map();
      state.exercises.forEach(ex => {
        const key = ex.name.toLowerCase();
        const best = exerciseBest(ex);
        if (best <= 0) return;
        const current = map.get(key);
        if (!current || best > current.weight) {
          map.set(key, { name: ex.name, weight: best, date: ex.date });
        }
      });
      return Array.from(map.values()).sort((a, b) => b.weight - a.weight);
    }

    /**
     * Her hareket adı için güncel PR tutan seti belirler.
     * Eşitlik durumunda en eski kayıt (tarih → egzersiz → set sırası) kazanır,
     * böylece iki set aynı ağırlıktaysa rekor rozeti tek yerde kalır.
     */
    function currentPRSetIds() {
      const groups = new Map();
      state.exercises.forEach(function (ex, exIdx) {
        ex.sets.forEach(function (s, setIdx) {
          const w = num(s.weight);
          if (w <= 0) return;
          const key = ex.name.toLowerCase();
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push({ id: s.id, weight: w, date: ex.date, exIdx: exIdx, setIdx: setIdx });
        });
      });

      const ids = new Set();
      groups.forEach(function (list) {
        let best = list[0];
        list.forEach(function (c) {
          const newer = c.weight > best.weight ||
            (c.weight === best.weight && (
              c.date < best.date ||
              (c.date === best.date && (
                c.exIdx < best.exIdx ||
                (c.exIdx === best.exIdx && c.setIdx < best.setIdx)
              ))
            ));
          if (newer) best = c;
        });
        ids.add(best.id);
      });
      return ids;
    }

    /** Tüm setlerin PR bayraklarını güncel duruma göre senkronlar */
    function applyPRFlags() {
      const ids = currentPRSetIds();
      state.exercises.forEach(function (ex) {
        ex.sets.forEach(function (s) {
          s.isPR = ids.has(s.id);
        });
      });
    }

    /* ============================================================
       6. Tema
       ============================================================ */
    function applyTheme() {
      document.documentElement.setAttribute('data-theme', state.theme);
      const btn = document.getElementById('themeBtn');
      const label = document.getElementById('themeText');
      btn.textContent = state.theme === 'dark' ? '🌙' : '☀️';
      label.textContent = state.theme === 'dark' ? 'Karanlık' : 'Aydınlık';
    }

    function toggleTheme() {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      applyTheme();
      saveState();
    }

    /* ============================================================
       7. Bildirimler (toast)
       ============================================================ */
    function toast(message, type) {
      const stack = document.getElementById('toastStack');
      const el = document.createElement('div');
      el.className = 'toast is-' + (type || 'info');
      el.innerHTML = '<span class="toast-msg">' + esc(message) + '</span>' +
                     '<button class="toast-close" type="button" aria-label="Kapat">&times;</button>';
      stack.appendChild(el);

      /* Yeni bildirim en üste gelsin */
      stack.insertBefore(el, stack.firstChild);

      const close = function () {
        if (el.classList.contains('is-leaving')) return;
        el.classList.add('is-leaving');
        setTimeout(() => el.remove(), 200);
      };
      el.querySelector('.toast-close').addEventListener('click', close);
      setTimeout(close, 4200);
    }

    /* ============================================================
       8. Modal altyapısı (odak tuzağı + Esc + overlay)
       ============================================================ */
    const modalStack = [];
    let lastFocused = null;

    function openModal(buildContent, onMount) {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = '<div class="modal-content" role="dialog" aria-modal="true"></div>';
      const content = overlay.querySelector('.modal-content');
      content.appendChild(buildContent());

      document.body.appendChild(overlay);
      document.body.classList.add('no-scroll');
      lastFocused = document.activeElement;

      requestAnimationFrame(() => overlay.classList.add('is-open'));

      const onKeydown = function (e) {
        if (e.key === 'Escape') { e.preventDefault(); closeModal(overlay); return; }
        if (e.key === 'Tab') {
          const focusables = content.querySelectorAll(
            'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
          );
          if (!focusables.length) return;
          const first = focusables[0];
          const last = focusables[focusables.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      };
      overlay.addEventListener('keydown', onKeydown);
      overlay.addEventListener('mousedown', function (e) {
        if (e.target === overlay) closeModal(overlay);
      });

      modalStack.push(overlay);
      if (onMount) onMount(content);
      return overlay;
    }

    function closeModal(overlay) {
      const idx = modalStack.indexOf(overlay);
      if (idx === -1) return;
      modalStack.splice(idx, 1);
      overlay.classList.remove('is-open');
      setTimeout(() => overlay.remove(), 200);
      if (!modalStack.length) document.body.classList.remove('no-scroll');
      if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
    }

    /* ============================================================
       9. Render — gün ızgarası
       ============================================================ */
    function renderDays() {
      const grid = document.getElementById('daysGrid');
      const weekStart = startOfWeek(parseISO(state.selectedDate));
      const dates = weekDates(weekStart);
      const today = todayISO();

      const first = dates[0], last = dates[6];
      document.getElementById('weekLabel').textContent =
        formatDateShort(toISO(first)) + ' – ' + formatDateShort(toISO(last)) +
        ' ' + parseISO(toISO(last)).getFullYear();

      grid.innerHTML = dates.map(function (d) {
        const iso = toISO(d);
        const dow = d.getDay();
        const vol = volumeOn(iso);
        const selected = iso === state.selectedDate;
        const isToday = iso === today;
        const hasWorkout = exercisesOn(iso).length > 0;
        return '<button type="button" class="day-card' + (isToday ? ' is-today' : '') + '" ' +
               'data-date="' + iso + '" aria-pressed="' + (selected ? 'true' : 'false') + '" ' +
               'aria-label="' + esc(DAY_NAMES[dow] + ' ' + d.getDate() + ' ' + MONTH_NAMES[d.getMonth()]) +
               (hasWorkout ? ', antrenman var' : ', antrenman yok') + '">' +
                 '<span class="day-name">' + DAY_SHORT[dow] + '</span>' +
                 '<span class="day-number">' + d.getDate() + '</span>' +
                 '<span class="day-meta' + (hasWorkout ? ' has-workout' : '') + '">' +
                   (hasWorkout ? formatKg(vol) + ' kg' : '—') +
                 '</span>' +
               '</button>';
      }).join('');
    }

    /* ============================================================
       10. Render — görünüm yönlendirici
       ============================================================ */
    function renderView() {
      const panel = document.getElementById('viewPanel');
      document.querySelectorAll('.nav-tab').forEach(function (tab) {
        tab.setAttribute('aria-selected', tab.dataset.view === state.view ? 'true' : 'false');
      });
      panel.setAttribute('aria-labelledby', 'tab-' + state.view);

      if (state.view === 'gun') renderGunView(panel);
      else if (state.view === 'hafta') renderWeekView(panel);
      else if (state.view === 'kalori') renderKaloriView(panel);
      else renderMonthView(panel);
    }

    /* ---------- Gün görünümü ---------- */
    function renderGunView(panel) {
      const iso = state.selectedDate;
      const date = parseISO(iso);
      const exs = exercisesOn(iso);
      const vol = volumeOn(iso);
      const setCount = setsOn(iso);
      const best = exs.reduce(function (m, ex) { return Math.max(m, exerciseBest(ex)); }, 0);

      let html = '';

      html += '<div class="section-head">' +
                '<div>' +
                  '<h2 class="section-title">' + esc(DAY_NAMES[date.getDay()]) + ' Antrenmanı</h2>' +
                  '<p class="section-sub">' + esc(formatDateLong(iso)) + '</p>' +
                '</div>' +
              '</div>';

      html += '<div class="stats-grid">' +
                statCard(formatKg(vol), 'kg·tekrar', 'Hacim', true) +
                statCard(setCount, '', 'Toplam Set', false) +
                statCard(formatKg(best), 'kg', 'En Yüksek Set', false) +
                statCard(exs.length, '', 'Hareket', false) +
              '</div>';

      if (exs.length === 0) {
        html += '<div class="empty-state">' +
                  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">' +
                    '<path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/>' +
                  '</svg>' +
                  '<h3>Bu gün için kayıt yok</h3>' +
                  '<p>Bir program seçip önerilen hareketleri otomatik ekleyebilir ya da kendi hareketini yazabilirsin.</p>' +
                '</div>';
        html += renderProgramSelector();
      } else {
        html += exs.map(function (ex, idx) { return renderExerciseCard(ex, idx); }).join('');
      }

      html += '<div class="btn-row" style="margin-top:18px">' +
                '<button class="btn btn-primary" type="button" data-action="add-exercise">' +
                  '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">' +
                    '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>' +
                  '</svg> Hareket Ekle</button>' +
                (exs.length ? '<button class="btn btn-secondary" type="button" data-action="add-from-program">Programdan Ekle</button>' : '') +
              '</div>';

      /* Geçen hafta karşılaştırması + kopyalama + artış hedefleri */
      html += renderPreviousWeekPanel();

      panel.innerHTML = html;
    }

    function statCard(value, unit, label, accent) {
      return '<div class="stat-card' + (accent ? ' is-accent' : '') + '">' +
               '<div class="stat-value">' + esc(value) + (unit ? '<span class="unit">' + esc(unit) + '</span>' : '') + '</div>' +
               '<div class="stat-label">' + esc(label) + '</div>' +
             '</div>';
    }

    /* ============================================================
       Geçen hafta paneli — karşılaştırma + kopyalama + artış hedefleri
       ============================================================ */
    function renderPreviousWeekPanel() {
      const currISO = state.selectedDate;
      const prevISO = sameDayPreviousWeek(currISO);
      /* Geçen haftanın gün aralığı (seçili haftanın bir hafta öncesi) */
      const prevBounds = weekBounds(prevISO);

      /* Önceki haftada hiç kayıt yoksa uyarı göster */
      const prevWeekAny = volumeInRange(prevBounds.start, prevBounds.end);
      const prevDayExs = exercisesOn(prevISO);

      /* Kullanıcı geçen haftadan farklı bir gün seçtiyse onu kullan */
      const srcISO = (state.copySourceDate && prevBounds.dates.some(function (d) {
        return toISO(d) === state.copySourceDate;
      })) ? state.copySourceDate : prevISO;

      const rows = compareDay(srcISO, currISO);
      const pending = rows.filter(function (r) { return r.status === 'new' || r.status === 'behind'; });

      let html = '<section class="compare-panel" aria-label="Geçen hafta karşılaştırması">';

      /* --- Başlık --- */
      const srcExs = exercisesOn(srcISO);
      const srcHasData = srcExs.length > 0;
      html += '<div class="compare-head">' +
                '<div>' +
                  '<div class="compare-title">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">' +
                      '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>' +
                    '</svg> Geçen Hafta' +
                  '</div>' +
                  '<div class="compare-sub">' + esc(formatDateLong(srcISO)) + ' — ' +
                    (!srcHasData ? 'bu günde kayıt yok' :
                     pending.length ? pending.length + ' hareket bekliyor' : 'Tüm hareketler tamamlandı') +
                  '</div>' +
                '</div>' +
                '<div class="compare-actions">' +
                  (srcHasData ? '<button class="btn btn-sm btn-secondary" type="button" data-action="copy-week-plain">Aynısını Kopyala</button>' +
                   '<button class="btn btn-sm btn-primary" type="button" data-action="copy-week-progression">Artışla Kopyala</button>' : '') +
                '</div>' +
              '</div>';

      /* --- Önceki haftadaki gün seçici --- */
      html += '<div class="week-picker">' +
                '<span class="week-picker-label">Geçen haftanın günü:</span>' +
                '<div class="week-picker-days">';
      prevBounds.dates.forEach(function (d) {
        const iso = toISO(d);
        const exs = exercisesOn(iso);
        const isTarget = iso === srcISO;
        html += '<button type="button" class="week-day-btn" data-copy-date="' + iso + '" aria-pressed="' + (isTarget ? 'true' : 'false') + '">' +
                  '<span class="dot' + (exs.length ? '' : ' empty') + '" aria-hidden="true"></span>' +
                  esc(DAY_SHORT[d.getDay()]) + ' ' + d.getDate() +
                '</button>';
      });
      html += '</div></div>';

      /* --- Karşılaştırma satırları --- */
      if (!rows.length) {
        html += '<p class="compare-sub">Bu gün için geçen haftanın kaydı bulunmuyor.</p>';
      } else {
        html += '<div class="compare-list">';
        rows.forEach(function (r) {
          html += renderCompareRow(r, currISO, srcISO);
        });
        html += '</div>';
      }

      /* --- Progresif artış özeti --- */
      html += renderProgressionBox(rows);

      html += '</section>';
      return html;
    }

    function renderCompareRow(r, currISO, prevISO) {
      const statusLabel = {
        'new': 'Yeni', 'behind': 'Eksik', 'ahead': 'Geçildi', 'same': 'Tamam', 'extra': 'Fazladan'
      }[r.status] || '';

      const prevSets = r.prev ? r.prev.sets : [];
      const prevBest = r.prev ? exerciseBest(r.prev) : 0;
      const currBest = r.current ? exerciseBest(r.current) : 0;
      const currVol = r.current ? exerciseVolume(r.current) : 0;

      let detail = '';
      if (r.prev) {
        const prevDetail = prevSets.map(function (s) {
          return formatKg(s.weight) + '×' + formatKg(s.reps);
        }).join(', ');
        detail = '<b>Geçen hafta:</b> ' + esc(prevDetail || '—') +
                 ' <span class="status-tag tag-' + r.status + '">' + statusLabel + '</span>';
        if (r.current && currVol > 0) {
          detail += '<br><b>Bu hafta:</b> ' + esc(formatKg(currBest) + ' kg en iyi · ' + formatKg(currVol) + ' kg·tekrar hacim');
        }
      } else {
        detail = 'Bu gün sadece bulunan hareket — geçen hafta karşılığı yok' +
                 ' <span class="status-tag tag-extra">Fazladan</span>';
      }

      /* Hedef artış metni */
      let target = '';
      if (r.targets.sets.length) {
        const t = r.targets.sets[r.targets.sets.length - 1];
        const gain = t.gain;
        if (gain.type === 'weight') {
          target = 'Hedef: <span class="compare-target">' + formatKg(t.weight) + ' kg × ' + formatKg(t.reps) +
                   '</span> (+' + formatKg(gain.amount) + ' kg)';
        } else if (gain.type === 'reps') {
          target = 'Hedef: <span class="compare-target">' + formatKg(t.weight) + ' kg × ' + formatKg(t.reps) +
                   '</span> (+' + formatKg(gain.amount) + ' tekrar)';
        } else {
          target = 'Hedef: <span class="compare-target">' + formatKg(t.weight) + ' kg × ' + formatKg(t.reps) + '</span> ' +
                   '(+' + formatKg(gain.weight) + ' kg, +' + formatKg(gain.reps) + ' tekrar)';
        }
      }

      /* Aksiyonlar */
      let actions = '';
      if (r.prev) {
        const alreadyThere = r.current !== null;
        actions += '<button class="btn btn-sm btn-secondary" type="button" data-action="copy-ex-plain" ' +
                   'data-name="' + esc(r.name) + '" data-src="' + esc(prevISO) + '">Kopyala</button>';
        actions += '<button class="btn btn-sm btn-primary" type="button" data-action="copy-ex-progression" ' +
                   'data-name="' + esc(r.name) + '" data-src="' + esc(prevISO) + '"' +
                   (alreadyThere ? ' disabled title="Bu hareket bu gün zaten var"' : '') + '>Artışla Ekle</button>';
      }

      return '<div class="compare-row status-' + r.status + '">' +
               '<div class="compare-info">' +
                 '<div class="compare-name">' + esc(r.name) + '</div>' +
                 '<div class="compare-detail">' + detail + '</div>' +
                 (target ? '<div class="compare-detail" style="margin-top:4px">' + target + '</div>' : '') +
               '</div>' +
               '<div class="compare-actions">' + actions + '</div>' +
             '</div>';
    }

    /** Artış kurallarını ve her hareket için hedef değerleri gösteren kutu */
    function renderProgressionBox(rows) {
      const withTargets = rows.filter(function (r) { return r.targets.sets.length; });

      const upper = state.progression.weightStep;
      const lower = state.progression.weightStepLower;

      let html = '<div class="progression-box">' +
        '<div class="progression-head">' +
          '<div class="progression-title">Progresif Artış Hedefleri</div>' +
          '<div class="progression-rule" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
            '<span>Üst vücut +' + formatKg(upper) + ' kg · Alt vücut +' + formatKg(lower) + ' kg · Tekrar +' + formatKg(state.progression.repStep) + '</span>' +
            '<button class="btn btn-sm btn-ghost" type="button" data-action="edit-progression">Kuralı Düzenle</button>' +
          '</div>' +
        '</div>';

      if (!withTargets.length) {
        html += '<p class="compare-sub" style="margin:0">Hedef görmek için geçen haftanın bir gününü seç.</p></div>';
        return html;
      }

      html += '<div class="progression-list">';

      withTargets.forEach(function (r) {
        const last = r.targets.sets[r.targets.sets.length - 1];
        let gainLabel = '';
        if (last.gain.type === 'weight') gainLabel = '+' + formatKg(last.gain.amount) + ' kg';
        else if (last.gain.type === 'reps') gainLabel = '+' + formatKg(last.gain.amount) + ' tekrar';
        else gainLabel = '+' + formatKg(last.gain.weight) + ' kg / +' + formatKg(last.gain.reps) + ' tekrar';

        html += '<div class="progression-item">' +
                  '<span class="progression-name">' + esc(r.name) + '</span>' +
                  '<span class="progression-values">' +
                    '<span>' + formatKg(last.prevWeight) + ' kg × ' + formatKg(last.prevReps) + '</span>' +
                    '<span class="progression-arrow">→</span>' +
                    '<span class="progression-new">' + formatKg(last.weight) + ' kg × ' + formatKg(last.reps) + '</span>' +
                    '<span class="progression-gain">' + esc(gainLabel) + '</span>' +
                  '</span>' +
                '</div>';
      });

      html += '</div></div>';
      return html;
    }

    function renderExerciseCard(ex, idx) {
      const prog = PROGRAMS[ex.program] || PROGRAMS.custom;
      const best = exerciseBest(ex);
      const lastSet = ex.sets[ex.sets.length - 1];
      const lastWeight = lastSet ? num(lastSet.weight) : 0;
      const progress = best > 0 ? Math.min(100, (lastWeight / best) * 100) : 0;
      const volume = exerciseVolume(ex);
      const hasPR = ex.sets.some(function (s) { return !!s.isPR && num(s.weight) > 0; });

      let html = '<article class="exercise-card" data-exercise-id="' + esc(ex.id) + '">';
      html += '<div class="exercise-head">' +
                '<div class="exercise-title">' +
                  '<span class="exercise-name">' + esc(ex.name) + '</span>' +
                  '<span class="badge badge-program" style="--badge-bg:' + hexToRgba(prog.color, .16) + ';--badge-fg:' + prog.color + '">' +
                    prog.emoji + ' ' + esc(prog.name) +
                  '</span>' +
                  (hasPR ? '<span class="badge badge-pr">🏆 Rekor</span>' : '') +
                '</div>' +
                '<div class="exercise-stats">' +
                  '<div class="ex-stat"><div class="ex-stat-value">' + formatKg(volume) + '</div><div class="ex-stat-label">Hacim</div></div>' +
                  '<div class="ex-stat"><div class="ex-stat-value">' + formatKg(best) + '</div><div class="ex-stat-label">En İyi</div></div>' +
                  '<button class="btn btn-sm btn-ghost" type="button" data-action="delete-exercise" data-ex="' + esc(ex.id) + '" aria-label="' + esc(ex.name) + ' hareketini sil">Sil</button>' +
                '</div>' +
              '</div>';

      if (ex.sets.length) {
        html += '<div class="sets-head" aria-hidden="true"><span>Set</span><span>Kilo</span><span>Tekrar</span><span style="text-align:right">Hacim</span><span></span></div>';
        html += ex.sets.map(function (set, sIdx) {
          const isPR = !!set.isPR && num(set.weight) > 0;
          return '<div class="set-row' + (isPR ? ' is-pr' : '') + '" data-set-id="' + esc(set.id) + '">' +
                   '<span class="set-index">' + (sIdx + 1) + (isPR ? ' 🏆' : '') + '</span>' +
                   '<input class="set-input weight" type="number" inputmode="decimal" step="0.5" min="0" ' +
                     'placeholder="kilo" value="' + (set.weight ? num(set.weight) : '') + '" ' +
                     'data-field="weight" data-ex="' + esc(ex.id) + '" data-set="' + esc(set.id) + '" aria-label="' + (sIdx + 1) + '. set ağırlığı (kg)">' +
                   '<input class="set-input reps" type="number" inputmode="numeric" step="1" min="0" ' +
                     'placeholder="tekrar" value="' + (set.reps ? num(set.reps) : '') + '" ' +
                     'data-field="reps" data-ex="' + esc(ex.id) + '" data-set="' + esc(set.id) + '" aria-label="' + (sIdx + 1) + '. set tekrar sayısı">' +
                   '<span class="set-volume">' + (setVolume(set) ? formatKg(setVolume(set)) : '—') + '</span>' +
                   '<button class="row-del" type="button" data-action="delete-set" data-ex="' + esc(ex.id) + '" data-set="' + esc(set.id) + '" aria-label="' + (sIdx + 1) + '. seti sil">' +
                     '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">' +
                       '<line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/>' +
                     '</svg>' +
                   '</button>' +
                 '</div>';
        }).join('');
      } else {
        html += '<p class="section-sub" style="margin-bottom:8px">Henüz set yok.</p>';
      }

      html += '<button class="add-set-btn" type="button" data-action="add-set" data-ex="' + esc(ex.id) + '">+ Set Ekle</button>';
      html += '<div class="progress-track"><div class="progress-fill" style="width:' + progress.toFixed(1) + '%"></div></div>';
      html += '</article>';
      return html;
    }

    function renderProgramSelector() {
      let html = '<div class="program-selector" role="group" aria-label="Program seç">';
      Object.keys(PROGRAMS).forEach(function (key) {
        const p = PROGRAMS[key];
        const active = state.activeProgram === key;
        html += '<button type="button" class="program-chip" data-program="' + key + '" aria-pressed="' + (active ? 'true' : 'false') + '" ' +
                'style="--chip-color:' + p.color + ';--chip-bg:' + hexToRgba(p.color, .16) + '">' +
                  '<span class="chip-dot" aria-hidden="true"></span>' + p.emoji + ' ' + esc(p.name) +
                '</button>';
      });
      html += '</div>';
      return html;
    }

    /* ---------- Hafta görünümü ---------- */
    function renderWeekView(panel) {
      const weekStart = startOfWeek(parseISO(state.selectedDate));
      const dates = weekDates(weekStart);
      const from = toISO(dates[0]), to = toISO(dates[6]);
      const weekVol = volumeInRange(from, to);
      const weekSets = state.exercises.reduce(function (sum, ex) {
        if (ex.date >= from && ex.date <= to) return sum + ex.sets.length;
        return sum;
      }, 0);
      const workoutDays = workoutsInRange(from, to);
      const maxVol = Math.max.apply(null, dates.map(function (d) { return volumeOn(toISO(d)); }).concat([1]));

      let html = '<div class="section-head">' +
                   '<div><h2 class="section-title">Hafta Özeti</h2>' +
                   '<p class="section-sub">' + esc(formatDateShort(from)) + ' – ' + esc(formatDateShort(to)) + '</p></div>' +
                 '</div>';

      html += '<div class="stats-grid">' +
                statCard(formatKg(weekVol), 'kg·tekrar', 'Haftalık Hacim', true) +
                statCard(weekSets, '', 'Toplam Set', false) +
                statCard(workoutDays + '/7', '', 'Antrenman Günü', false) +
                statCard(formatKg(weekVol / 7), 'kg·tekrar', 'Günlük Ortalama', false) +
              '</div>';

      html += '<div class="week-summary">';
      dates.forEach(function (d) {
        const iso = toISO(d);
        const vol = volumeOn(iso);
        const pct = (vol / maxVol) * 100;
        const exs = exercisesOn(iso);
        html += '<button type="button" class="summary-row' + (iso === state.selectedDate ? ' is-selected' : '') + '" data-date="' + iso + '">' +
                  '<span class="summary-day">' + esc(DAY_SHORT[d.getDay()]) +
                    '<small>' + d.getDate() + ' ' + esc(MONTH_NAMES[d.getMonth()]) + '</small>' +
                  '</span>' +
                  '<span class="bar-track"><span class="bar-fill" style="width:' + pct.toFixed(1) + '%"></span></span>' +
                  '<span class="summary-value">' + (exs.length ? formatKg(vol) : '—') +
                    '<small>' + (exs.length ? exs.length + ' hareket' : 'dinsiz') + '</small>' +
                  '</span>' +
                '</button>';
      });
      html += '</div>';

      /* ---------- Geçen haftanın özeti ---------- */
      const prevFrom = toISO(addDays(dates[0], -7));
      const prevTo = toISO(addDays(dates[6], -7));
      const prevVol = volumeInRange(prevFrom, prevTo);
      const prevDays = workoutsInRange(prevFrom, prevTo);
      const prevSets = state.exercises.reduce(function (sum, ex) {
        if (ex.date >= prevFrom && ex.date <= prevTo) return sum + ex.sets.length;
        return sum;
      }, 0);
      const prevMaxVol = Math.max.apply(null, weekDates(addDays(dates[0], -7))
        .map(function (d) { return volumeOn(toISO(d)); }).concat([1]));

      html += '<div class="section-head" style="margin-top:26px">' +
                '<div><h2 class="section-title">Geçen Hafta</h2>' +
                '<p class="section-sub">' + esc(formatDateShort(prevFrom)) + ' – ' + esc(formatDateShort(prevTo)) + '</p></div>' +
                '<div class="compare-actions">' +
                  '<button class="btn btn-sm btn-secondary" type="button" data-action="goto-prev-week">Geçen Haftaya Git</button>' +
                '</div>' +
              '</div>';

      html += '<div class="stats-grid">' +
                statCard(formatKg(prevVol), 'kg·tekrar', 'Geçen Hafta Hacmi', false) +
                statCard(prevSets, '', 'Geçen Hafta Set', false) +
                statCard(prevDays + '/7', '', 'Antrenman Günü', false) +
                statCard(prevVol > 0 ? formatKg(prevVol / 7) : '0', 'kg·tekrar', 'Günlük Ortalama', false) +
              '</div>';

      html += '<div class="week-summary is-prev">';
      weekDates(addDays(dates[0], -7)).forEach(function (d) {
        const iso = toISO(d);
        const vol = volumeOn(iso);
        const pct = (vol / prevMaxVol) * 100;
        const exs = exercisesOn(iso);
        html += '<button type="button" class="summary-row" data-date="' + iso + '">' +
                  '<span class="summary-day">' + esc(DAY_SHORT[d.getDay()]) +
                    '<small>' + d.getDate() + ' ' + esc(MONTH_NAMES[d.getMonth()]) + '</small>' +
                  '</span>' +
                  '<span class="bar-track"><span class="bar-fill" style="width:' + pct.toFixed(1) + '%"></span></span>' +
                  '<span class="summary-value">' + (exs.length ? formatKg(vol) : '—') +
                    '<small>' + (exs.length ? exs.length + ' hareket' : 'dinsiz') + '</small>' +
                  '</span>' +
                '</button>';
      });
      html += '</div>';

      html += '<p class="section-sub" style="margin-top:14px">Bir güne tıklayarak o günün detaylarına geçebilirsin.</p>';
      panel.innerHTML = html;
    }

    /* ---------- Ay görünümü ---------- */
    function renderMonthView(panel) {
      const selected = parseISO(state.selectedDate);
      const year = selected.getFullYear();
      const month = selected.getMonth();
      const range = monthRange(selected);
      const monthVol = volumeInRange(range.from, range.to);
      const monthWorkouts = workoutsInRange(range.from, range.to);
      const monthSets = state.exercises.reduce(function (sum, ex) {
        if (ex.date >= range.from && ex.date <= range.to) return sum + ex.sets.length;
        return sum;
      }, 0);

      let html = '<div class="section-head">' +
                   '<div><h2 class="section-title">' + MONTH_NAMES[month] + ' ' + year + '</h2>' +
                   '<p class="section-sub">Aylık antrenman özeti</p></div>' +
                 '</div>';

      html += '<div class="stats-grid">' +
                statCard(formatKg(monthVol), 'kg·tekrar', 'Aylık Hacim', true) +
                statCard(monthWorkouts, '', 'Antrenman', false) +
                statCard(monthSets, '', 'Toplam Set', false) +
                statCard(formatKg(monthVol / Math.max(1, monthWorkouts)), 'kg·tekrar', 'Antrenman Başına', false) +
              '</div>';

      /* --- Takvim --- */
      const first = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const gridStart = startOfWeek(first);
      const gridEnd = addDays(startOfWeek(lastDay), 6);
      const today = todayISO();

      /* Ayın tamamını kapsayan hücreler (Pzt başlangıçlı) */
      const cells = [];
      for (let d = new Date(gridStart); d <= gridEnd; d = addDays(d, 1)) {
        cells.push(new Date(d.getFullYear(), d.getMonth(), d.getDate()));
      }

      html += '<div class="calendar">';
      WEEK_ORDER.forEach(function (dow) {
        html += '<div class="cal-head">' + esc(DAY_SHORT[dow]) + '</div>';
      });
      cells.forEach(function (d) {
        const iso = toISO(d);
        const vol = volumeOn(iso);
        const outside = !sameMonth(d, first);
        html += '<button type="button" class="cal-cell' + (outside ? ' is-outside' : '') + (iso === today ? ' is-today' : '') + (vol > 0 ? ' has-workout' : '') + '" ' +
                'data-date="' + iso + '" aria-pressed="' + (iso === state.selectedDate ? 'true' : 'false') + '" ' +
                'aria-label="' + esc(d.getDate() + ' ' + MONTH_NAMES[d.getMonth()] + (vol > 0 ? ', ' + formatKg(vol) + ' kg hacim' : '')) + '">' +
                  '<span class="cal-num">' + d.getDate() + '</span>' +
                  '<span class="cal-vol">' + (vol > 0 ? formatKg(vol) + ' kg' : '') + '</span>' +
                '</button>';
      });
      html += '</div>';

      /* --- Rekorlar --- */
      const prs = personalRecords();
      html += '<h3 class="section-title" style="margin-top:22px;font-size:15px">Rekorlar</h3>';
      if (!prs.length) {
        html += '<p class="section-sub" style="margin-top:8px">Henüz ağırlık kaydı yok. Bir sete kilo girildiğinde burada listelenir.</p>';
      } else {
        html += '<div class="pr-list" style="margin-top:10px">';
        prs.slice(0, 8).forEach(function (pr) {
          html += '<div class="pr-row">' +
                    '<div><div class="pr-name">' + esc(pr.name) + '</div>' +
                    '<div class="pr-date">' + esc(formatDateShort(pr.date)) + '</div></div>' +
                    '<div class="pr-weight">' + formatKg(pr.weight) + ' kg</div>' +
                  '</div>';
        });
        html += '</div>';
      }

      panel.innerHTML = html;
    }

     * Yerleşik listede sonuç yoksa internetten arama önerilir.

    function renderFoodResults() {
      const q = normalizeTr(foodQuery);

      if (q) {
        results = searchFoods(foodQuery, 40);

      results.forEach(function (f) {
        html += renderFoodResultRow(f);

      html += '</div>';
      return html;

        html += '<div class="off-status"><span class="off-status-dot"></span>' +

    /* ============================================================
       13. Veri işlemleri
       ============================================================ */
    function addExercise(name, program) {
      const ex = {
        id: uid('ex'),
        name: name,
        program: (program && PROGRAMS[program]) ? program : (state.activeProgram || 'custom'),
        date: state.selectedDate,
        sets: [{ id: uid('set'), weight: 0, reps: 8 }]
      };
      state.exercises.push(ex);
      return ex;
    }

    /**
     * Bir egzersizi hedef güne kopyalar.
     * @param mode 'plain'  → aynı kilo/tekrar
     *        'progression' → artış uygulanmış hedef değerler
     */
    function copyExercise(src, targetDate, mode) {
      const program = (src.program && PROGRAMS[src.program]) ? src.program : 'custom';
      const ex = {
        id: uid('ex'),
        name: src.name,
        program: program,
        date: targetDate,
        sets: []
      };

      if (mode === 'progression') {
        const targets = progressionTargets(src);
        if (targets.sets.length) {
          ex.sets = targets.sets.map(function (t) {
            return { id: uid('set'), weight: t.weight, reps: t.reps };
          });
        } else {
          ex.sets = [{ id: uid('set'), weight: 0, reps: 8 }];
        }
      } else {
        ex.sets = src.sets.map(function (s) {
          return { id: uid('set'), weight: num(s.weight), reps: num(s.reps) };
        });
        if (!ex.sets.length) ex.sets = [{ id: uid('set'), weight: 0, reps: 8 }];
      }

      state.exercises.push(ex);
      return ex;
    }

    /**
     * Bir günün tüm hareketlerini hedef güne kopyalar.
     * @param mode 'plain' | 'progression'
     * @param skipExisting true ise aynı isimli hareketler atlanır
     */
    function copyDay(sourceDate, targetDate, mode, skipExisting) {
      const srcs = exercisesOn(sourceDate);
      if (!srcs.length) return { copied: 0, skipped: 0 };

      const existing = exercisesOn(targetDate).map(function (e) {
        return e.name.toLowerCase();
      });

      let copied = 0, skipped = 0;
      srcs.forEach(function (src) {
        const key = src.name.toLowerCase();
        if (skipExisting && existing.indexOf(key) !== -1) {
          skipped++;
          return;
        }
        copyExercise(src, targetDate, mode);
        existing.push(key);
        copied++;
      });

      return { copied: copied, skipped: skipped };
    }

    /** Tek bir hareketi geçen haftadan bu güne kopyalar */
    function copySingleExercise(srcDate, name, mode) {
      const src = exercisesOn(srcDate).find(function (e) {
        return e.name.toLowerCase() === String(name).toLowerCase();
      });
      if (!src) {
        toast('Kaynak hareket bulunamadı.', 'warning');
        return;
      }

      const already = exercisesOn(state.selectedDate).some(function (e) {
        return e.name.toLowerCase() === src.name.toLowerCase();
      });

      if (already) {
        toast('"' + src.name + '" bu gün zaten var.', 'warning');
        return;
      }

      copyExercise(src, state.selectedDate, mode);
      applyPRFlags();
      saveState();
      render();

      const t = progressionTargets(src);
      const lastT = t.sets[t.sets.length - 1];
      if (mode === 'progression' && lastT) {
        toast('"' + src.name + '" eklendi → hedef: ' + formatKg(lastT.weight) + ' kg × ' + formatKg(lastT.reps), 'success');
      } else {
        toast('"' + src.name + '" kopyalandı.', 'success');
      }
    }

    /** Seçili kaynak günün tüm hareketlerini bu güne kopyalar */
    function copyWholeWeek(mode) {
      const srcISO = resolveCopySource();
      const result = copyDay(srcISO, state.selectedDate, mode, true);

      if (!result.copied) {
        toast(result.skipped ? 'Seçilen gündeki hareketler zaten bu gün var.' : 'Kaynak günde kayıt bulunamadı.', 'warning');
        return;
      }

      applyPRFlags();
      saveState();
      render();

      const label = mode === 'progression' ? 'artış uygulandı' : 'aynen kopyalandı';
      let msg = result.copied + ' hareket ' + label;
      if (result.skipped) msg += ' · ' + result.skipped + ' hareket zaten vardı';
      toast(msg, 'success');
    }

    /** Kopyalama kaynağı: seçili gün ya da önceki haftanın aynı günü */
    function resolveCopySource() {
      const prevISO = sameDayPreviousWeek(state.selectedDate);
      const prevBounds = weekBounds(prevISO);
      if (state.copySourceDate && prevBounds.dates.some(function (d) {
        return toISO(d) === state.copySourceDate;
      })) {
        return state.copySourceDate;
      }
      return prevISO;
    }

    function findExercise(id) {
      return state.exercises.find(function (e) { return e.id === id; }) || null;
    }

    function findSet(exerciseId, setId) {
      const ex = findExercise(exerciseId);
      if (!ex) return null;
      return ex.sets.find(function (s) { return s.id === setId; }) || null;
    }

    function deleteExercise(id) {
      const ex = findExercise(id);
      if (!ex) return;
      state.exercises = state.exercises.filter(function (e) { return e.id !== id; });
      applyPRFlags();
      saveState();
      render();
      toast('"' + ex.name + '" silindi.', 'success');
    }

    function deleteSet(exerciseId, setId) {
      const ex = findExercise(exerciseId);
      if (!ex) return;
      ex.sets = ex.sets.filter(function (s) { return s.id !== setId; });
      applyPRFlags();
      saveState();
      render();
    }

    function addSet(exerciseId) {
      const ex = findExercise(exerciseId);
      if (!ex) return;
      const last = ex.sets[ex.sets.length - 1];
      ex.sets.push({
        id: uid('set'),
        weight: last ? num(last.weight) : 0,
        reps: last ? num(last.reps) : 8
      });
      applyPRFlags();
      saveState();
      render();
    }

    /* ============================================================
       Yemek kaydı işlemleri
       ============================================================ */

    /** Arama sonucundaki yemeği id'den bulur (yerleşik, özel veya internetten) */
    function findFoodByResultId(id) {
      const str = String(id || '');
      if (str.indexOf('food-') === 0) {
        const idx = parseInt(str.slice(5), 10);
        return (Number.isInteger(idx) && FOODS[idx])
          ? { name: FOODS[idx].name, kcal: FOODS[idx].kcal, p: FOODS[idx].p,
              c: FOODS[idx].c, f: FOODS[idx].f,
              portion: FOODS[idx].portion || '', portionG: FOODS[idx].portionG || 0 }
          : null;
      }
      if (str.indexOf('cfood-') === 0) {
        const cf = state.customFoods.find(function (x) { return x.id === str.slice(6); });
        return cf
          ? { name: cf.name, kcal: cf.kcal, p: cf.protein, c: cf.carbs, f: cf.fat,
              portion: '100 g', portionG: 100 }
          : null;
      }
      if (str.indexOf('off-') === 0) {
        const idx = parseInt(str.slice(4), 10);
        const f = offState.results.find(function (x) { return x.id === str; });
        return f
          ? { name: f.name, kcal: f.kcal, p: f.p, c: f.c, f: f.f,
              portion: '100 g', portionG: 100 }
          : null;
      }
      return null;
    }

    /**
     * Yemeği günlük kayda ekler.
     * Değerler 100 g başınadır → gram miktarıyla ölçeklenir.
     */
    function addFoodLog(food, grams, meal) {
      const g = num(grams);
      if (g <= 0) return false;
      const m = MEALS.indexOf(meal) !== -1 ? meal : 'Atıştırmalık';
      const factor = g / 100;

      state.foodLog.push(normalizeFoodLog({
        id: uid('food'),
        date: state.selectedDate,
        meal: m,
        name: food.name,
        grams: g,
        kcal: num(food.kcal) * factor,
        protein: num(food.p) * factor,
        carbs: num(food.c) * factor,
        fat: num(food.f) * factor
      }));

      saveState();
      render();
      toast(food.name + ' (' + formatKg(g) + ' g) → ' + m, 'success');
      return true;
    }

    /** Günlük yemek kaydını siler */
    function deleteFoodLog(id) {
      const item = state.foodLog.find(function (f) { return f.id === id; });
      if (!item) return;
      state.foodLog = state.foodLog.filter(function (f) { return f.id !== id; });
      saveState();
      render();
      toast('"' + item.name + '" silindi.', 'success');
    }

    /**
     * Open Food Facts'ta arama yapar ve sonuçları arama kutusunun altında gösterir.
     * Hata/bağlantı yoksa uygulama bozulmaz, yalnızca mesaj gösterilir.
     */
    function searchOffFoods() {
      const q = String(foodQuery || '').trim();

      if (!q) {
        offState = { status: 'idle', query: '', results: [], message: '' };
        refreshFoodResults();
        toast('Önce arama kutusuna bir ürün yaz.', 'warning');
        return;
      }

      offState = { status: 'loading', query: q, results: [], message: '' };
      refreshFoodResults();

      fetchOffFoods(q)
        .then(function (res) {
          /* Kullanıcı bu arada başka bir arama yaptıysa bu sonucu yok say */
          if (offState.query !== q) return;

          if (!res.ok) {
            offState = { status: 'error', query: q, results: [], message: res.message };
            refreshFoodResults();
            toast(res.message, 'error');
            return;
          }

          offState = { status: 'ok', query: q, results: res.results, message: '' };
          refreshFoodResults();

          if (!res.results.length) {
            toast('Open Food Facts\'ta bu ürün için sonuç bulunamadı.', 'warning');
          }
        })
        .catch(function () {
          if (offState.query !== q) return;
          const msg = 'İnternet araması başarısız oldu. Bağlantını kontrol edip tekrar dene.';
          offState = { status: 'error', query: q, results: [], message: msg };
          refreshFoodResults();
          toast(msg, 'error');
        });
    }

     * Yeni bir özel yemek ekler (değerler 100 g başına).
     * @returns {boolean} kaydedildiyse true
     */
    function addCustomFood(food) {
      const name = String(food.name || '').trim();
      if (!name) return false;
      const kcal = num(food.kcal);
      const protein = num(food.protein);
      const carbs = num(food.carbs);
      const fat = num(food.fat);
      if (kcal < 0 || protein < 0 || carbs < 0 || fat < 0) return false;

      state.customFoods.push(normalizeCustomFood({
        id: uid('cfood'),
        name: name,
        kcal: kcal,
        protein: protein,
        carbs: carbs,
        fat: fat
      }));

      saveState();
      render();
      toast('"' + name + '" özel yemek olarak eklendi.', 'success');
      return true;
    }

    /** Set değeri değişti: ağırlık/rep güncelle, PR kontrolü yap, ilgili DOM parçalarını tazele */
    function updateSet(exerciseId, setId, field, rawValue) {
      const ex = findExercise(exerciseId);
      const set = findSet(exerciseId, setId);
      if (!ex || !set) return;

      const value = Math.max(0, num(rawValue));
      const prevWeight = num(set.weight);
      set[field] = value;

      if (field === 'weight') {
        const wasPR = !!set.isPR;
        applyPRFlags();
        const isPR = !!set.isPR;
        if (isPR && !wasPR) {
          toast('🏆 Yeni rekor! ' + ex.name + ': ' + formatKg(value) + ' kg', 'success');
        } else if (!isPR && wasPR) {
          toast('Rekor düştü — ' + ex.name + ' için yeni rekor: ' + formatKg(exerciseBest(ex)) + ' kg', 'warning');
        } else if (isPR && value > prevWeight) {
          toast('🏆 Rekor yükseldi! ' + ex.name + ': ' + formatKg(value) + ' kg', 'success');
        }
      }

      saveState();
      refreshExerciseDerived(ex, set);
      renderDays();
      renderGoal();
      refreshDayStats();
    }

    /** Gün görünümündeki üst istatistik kartlarını odak kaybetmeden tazele */
    function refreshDayStats() {
      if (state.view !== 'gun') return;
      const iso = state.selectedDate;
      const exs = exercisesOn(iso);
      const cards = document.querySelectorAll('#viewPanel .stat-card');
      if (cards.length < 4) return;

      const values = [
        formatKg(volumeOn(iso)),
        String(setsOn(iso)),
        formatKg(exs.reduce(function (m, ex) { return Math.max(m, exerciseBest(ex)); }, 0)),
        String(exs.length)
      ];
      cards.forEach(function (card, i) {
        const valEl = card.querySelector('.stat-value');
        if (!valEl) return;
        const unitEl = valEl.querySelector('.unit');
        valEl.textContent = values[i];
        if (unitEl) valEl.appendChild(unitEl);
      });
    }

    /** Sadece türetilmiş değerleri tazele (input odağını bozmadan) */
    function refreshExerciseDerived(ex, changedSet) {
      const card = document.querySelector('.exercise-card[data-exercise-id="' + ex.id + '"]');
      if (!card) return;

      const best = exerciseBest(ex);
      const volume = exerciseVolume(ex);
      const lastSet = ex.sets[ex.sets.length - 1];
      const lastWeight = lastSet ? num(lastSet.weight) : 0;
      const progress = best > 0 ? Math.min(100, (lastWeight / best) * 100) : 0;

      const stats = card.querySelectorAll('.ex-stat-value');
      if (stats[0]) stats[0].textContent = formatKg(volume);
      if (stats[1]) stats[1].textContent = formatKg(best);

      const fill = card.querySelector('.progress-fill');
      if (fill) fill.style.width = progress.toFixed(1) + '%';

      /* Tüm satırların PR görünümünü senkronla (set eklenince bayrak eski sette kalmasın) */
      ex.sets.forEach(function (s, sIdx) {
        const row = card.querySelector('.set-row[data-set-id="' + s.id + '"]');
        if (!row) return;
        const isPR = !!s.isPR && num(s.weight) > 0;
        row.classList.toggle('is-pr', isPR);
        const idxEl = row.querySelector('.set-index');
        if (idxEl) idxEl.textContent = (sIdx + 1) + (isPR ? ' 🏆' : '');
        const volEl = row.querySelector('.set-volume');
        if (volEl) volEl.textContent = setVolume(s) ? formatKg(setVolume(s)) : '—';
      });

      /* Rekor rozetini güncelle */
      const hasPR = ex.sets.some(function (s) { return !!s.isPR && num(s.weight) > 0; });
      const title = card.querySelector('.exercise-title');
      const badge = title ? title.querySelector('.badge-pr') : null;
      if (hasPR && !badge) {
        const span = document.createElement('span');
        span.className = 'badge badge-pr';
        span.textContent = '🏆 Rekor';
        title.appendChild(span);
      } else if (!hasPR && badge) {
        badge.remove();
      }
    }

    function openExerciseModal() {
      const existing = exercisesOn(state.selectedDate).map(function (e) {

      let html = '<h3 class="modal-title">Hareket Ekle</h3>' +

      /* Öneriler — her zaman gösterilir, program seçiliyse ona göre */
      const program = state.activeProgram ? PROGRAMS[state.activeProgram] : null;
      const suggestions = [];
      if (program) {
        program.exercises.forEach(function (s) { if (existing.indexOf(s.toLowerCase()) === -1) suggestions.push(s); });
      }
      if (!suggestions.length) {
        Object.keys(PROGRAMS).forEach(function (key) {
          if (key === 'rest' || key === 'custom') return;
          PROGRAMS[key].exercises.forEach(function (s) {
            if (existing.indexOf(s.toLowerCase()) === -1 && suggestions.indexOf(s) === -1) suggestions.push(s);

        });

      if (suggestions.length) {
        html += '<div class="suggestion-chips" id="suggestionChips">';
        suggestions.forEach(function (s) {
          html += '<button type="button" class="suggestion-chip" data-suggestion="' + esc(s) + '" aria-pressed="false">' + esc(s) + '</button>';
        });
        html += '</div>';

      html += '<label class="modal-field"><span class="modal-label">Hareket adı</span>' +
              '<input type="text" class="modal-input" id="customExerciseName" placeholder="Örn. Bench Press" autocomplete="off"></label>' +

                '<button class="btn btn-secondary" type="button" data-modal="cancel">Vazgeç</button>' +
                '<button class="btn btn-primary" type="button" data-modal="save">Kaydet</button>' +
              '</div>';

      body.innerHTML = html;

      const overlay = openModal(function () { return body; }, function (content) {
        const input = content.querySelector('#customExerciseName');
        setTimeout(function () { input.focus(); }, 60);

        content.querySelectorAll('.suggestion-chip').forEach(function (chip) {
          chip.addEventListener('click', function () {
            content.querySelectorAll('.suggestion-chip').forEach(function (c) {
              c.setAttribute('aria-pressed', 'false');
            });
            chip.setAttribute('aria-pressed', 'true');
            input.value = chip.dataset.suggestion;
            input.focus();
          });
        });

        content.querySelector('[data-modal="cancel"]').addEventListener('click', function () {
          closeModal(overlay);
        });

        content.querySelector('[data-modal="save"]').addEventListener('click', function () {
          const name = input.value.trim();
          if (!name) {
            toast('Lütfen bir hareket adı girin.', 'warning');
            input.focus();
            return;
          }
          const exists = state.exercises.some(function (e) {
            return e.date === state.selectedDate && e.name.toLowerCase() === name.toLowerCase();
          });
          if (exists) {
            toast('Bu hareket bu gün zaten ekli.', 'warning');
            return;
          }
          addExercise(name, state.activeProgram);
          closeModal(overlay);
          saveState();
          render();
          toast('"' + name + '" eklendi.', 'success');
        });

        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            content.querySelector('[data-modal="save"]').click();
          }

      });

              content.querySelector('[data-modal="save"]').click();
            }
          });
        });
      });
    }

    /** Progresif artış kurallarını düzenleme modalı */
    function openProgressionModal() {
      const p = state.progression;
      const body = document.createElement('div');
      body.innerHTML =
        '<h3 class="modal-title">Progresif Artış Kuralları</h3>' +
        '<p class="modal-description">Her hafta hedef değerlerin ne kadar artacağı. Hareket adında "squat", "leg", "deadlift" gibi ipuçları varsa alt vücut kuralı uygulanır.</p>' +
        '<label class="modal-field"><span class="modal-label">Üst vücut — kilo artışı (kg)</span>' +
        '<input type="number" class="modal-input" id="stepUpper" min="0" step="0.5" value="' + num(p.weightStep) + '"></label>' +
        '<label class="modal-field"><span class="modal-label">Alt vücut — kilo artışı (kg)</span>' +
        '<input type="number" class="modal-input" id="stepLower" min="0" step="0.5" value="' + num(p.weightStepLower) + '"></label>' +
        '<label class="modal-field"><span class="modal-label">Tekrar artışı</span>' +
        '<input type="number" class="modal-input" id="stepReps" min="0" step="1" value="' + num(p.repStep) + '"></label>' +
        '<div class="modal-actions">' +
          '<button class="btn btn-secondary" type="button" data-modal="cancel">Vazgeç</button>' +
          '<button class="btn btn-primary" type="button" data-modal="save">Kaydet</button>' +
        '</div>';

      const overlay = openModal(function () { return body; }, function (content) {
        const upperEl = content.querySelector('#stepUpper');
        const lowerEl = content.querySelector('#stepLower');
        const repsEl = content.querySelector('#stepReps');
        setTimeout(function () { upperEl.focus(); }, 60);

        content.querySelector('[data-modal="cancel"]').addEventListener('click', function () { closeModal(overlay); });
        content.querySelector('[data-modal="save"]').addEventListener('click', function () {
          state.progression.weightStep = Math.max(0, num(upperEl.value));
          state.progression.weightStepLower = Math.max(0, num(lowerEl.value));
          state.progression.repStep = Math.max(0, Math.round(num(repsEl.value)));
          closeModal(overlay);
          saveState();
          render();
          toast('Artış kuralları güncellendi.', 'success');
        });
      });
    }

    function openConfirmModal(title, message, onConfirm) {
      const body = document.createElement('div');
      body.innerHTML =
        '<h3 class="modal-title">' + esc(title) + '</h3>' +
        '<p class="modal-description">' + esc(message) + '</p>' +
        '<div class="modal-actions">' +
          '<button class="btn btn-secondary" type="button" data-modal="cancel">Vazgeç</button>' +
          '<button class="btn btn-danger" type="button" data-modal="confirm">Sil</button>' +
        '</div>';

      const overlay = openModal(function () { return body; }, function (content) {
        content.querySelector('[data-modal="cancel"]').addEventListener('click', function () { closeModal(overlay); });
        content.querySelector('[data-modal="confirm"]').addEventListener('click', function () {
          closeModal(overlay);
          onConfirm();
        });
        setTimeout(function () { content.querySelector('[data-modal="confirm"]').focus(); }, 60);
      });
    }

    /* ============================================================
       15. Olay bağlama (delegation)
       ============================================================ */
    function bindEvents() {
      /* Tema */
      document.getElementById('themeToggle').addEventListener('click', toggleTheme);

      /* Sekmeler */
      document.querySelectorAll('.nav-tab').forEach(function (tab) {
        tab.addEventListener('click', function () {
          if (state.view === tab.dataset.view) return;
          state.view = tab.dataset.view;
          saveState();
          render();
        });
      });

      /* Hafta gezinme */
      document.getElementById('prevWeek').addEventListener('click', function () {
        state.selectedDate = toISO(addDays(parseISO(state.selectedDate), -7));
        state.copySourceDate = null;
        saveState();
        render();
      });
      document.getElementById('nextWeek').addEventListener('click', function () {
        state.selectedDate = toISO(addDays(parseISO(state.selectedDate), 7));
        state.copySourceDate = null;
        saveState();
        render();
      });

      /* Gün ızgarası / takvim / hafta özeti — ortak tarih seçimi */
      document.addEventListener('click', function (e) {
        const dateEl = e.target.closest('[data-date]');
        if (dateEl && dateEl.closest('#daysGrid, .calendar, .week-summary')) {
          state.selectedDate = dateEl.dataset.date;
          state.copySourceDate = null;
          saveState();
          render();
          return;
        }

        /* Program çipi */
        const chip = e.target.closest('[data-program]');
        if (chip) {
          const key = chip.dataset.program;
          state.activeProgram = state.activeProgram === key ? null : key;
          render();
          return;
        }

        /* Buton eylemleri */
        const actionEl = e.target.closest('[data-action]');
        if (!actionEl) return;
        const action = actionEl.dataset.action;

        if (action === 'add-exercise') {
          openExerciseModal();
        } else if (action === 'add-from-program') {
          openProgramApplyModal();
        } else if (action === 'edit-goal') {
          openGoalModal();
        } else if (action === 'goto-prev-week') {
          state.selectedDate = sameDayPreviousWeek(state.selectedDate);
          state.copySourceDate = null;
          state.view = 'gun';
          saveState();
          render();
        } else if (action === 'edit-calorie-goal') {
          openCalorieGoalModal();
        } else if (action === 'edit-progression') {
          openProgressionModal();
        } else if (action === 'add-set') {
          addSet(actionEl.dataset.ex);
        } else if (action === 'delete-set') {
          deleteSet(actionEl.dataset.ex, actionEl.dataset.set);
        } else if (action === 'delete-exercise') {
          const ex = findExercise(actionEl.dataset.ex);
          if (ex) {
            openConfirmModal(
              'Hareketi sil',
              '"' + ex.name + '" ve tüm set kayıtları silinecek. Emin misin?',
              function () { deleteExercise(ex.id); }
            );
          }
        } else if (action === 'copy-ex-plain') {
          copySingleExercise(actionEl.dataset.src, actionEl.dataset.name, 'plain');
        } else if (action === 'copy-ex-progression') {
          copySingleExercise(actionEl.dataset.src, actionEl.dataset.name, 'progression');
        } else if (action === 'copy-week-plain') {
          copyWholeWeek('plain');
        } else if (action === 'copy-week-progression') {
          copyWholeWeek('progression');
        } else if (action === 'add-food') {
          const food = findFoodByResultId(actionEl.dataset.foodId);
          if (food) openFoodModal(food);
        } else if (action === 'delete-food') {
          deleteFoodLog(actionEl.dataset.foodLogId);
        } else if (action === 'add-custom-food') {
          openCustomFoodModal();
        } else if (action === 'off-search') {
          searchOffFoods();
        } else if (action === 'delete-custom-food') {
          const cf = state.customFoods.find(function (f) { return f.id === actionEl.dataset.customFoodId; });
          if (cf) {
            openConfirmModal(
              'Özel yemeği sil',
              '"' + cf.name + '" özel yemek listesinden silinecek. Emin misin?',
              function () { deleteCustomFood(cf.id); }
            );
          }
        }
      });

      /* Yemek arama kutusu — yazdıkça filtrele (odak korunur) */
      document.addEventListener('input', function (e) {
        const input = e.target.closest('#foodSearch');
        if (!input) return;
        foodQuery = input.value;
        /* Arama metni değişti → önceki internet sonuçları geçersiz */
        offState = { status: 'idle', query: '', results: [], message: '' };
        refreshFoodResults();
      });

      /* Geçen haftanın gün seçici — hangi günün kopyalanacağını belirler */
      document.addEventListener('click', function (e) {
        const btn = e.target.closest('[data-copy-date]');
        if (!btn) return;
        state.copySourceDate = btn.dataset.copyDate;
        render();
      });

      /* Set input girişleri — odak kaybetmeden canlı güncelle */
      document.addEventListener('input', function (e) {
        const input = e.target.closest('.set-input');
        if (!input) return;
        updateSet(input.dataset.ex, input.dataset.set, input.dataset.field, input.value);
      });

      /* Sayı alanlarında ok tuşları tetiklemez — sadece değişimde de kaydet */
      document.addEventListener('change', function (e) {
        const input = e.target.closest('.set-input');
        if (!input) return;
        updateSet(input.dataset.ex, input.dataset.set, input.dataset.field, input.value);
      });
    }

    /* ============================================================
       16. Başlat
       ============================================================ */
    function init() {
      loadState();
      applyPRFlags();
      applyTheme();
      bindEvents();
      render();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
